function initAudio() {
    try {
        audio.context = new (window.AudioContext || window.webkitAudioContext)();
        audio.initialized = true;
        createProceduralSounds();
    } catch (e) {}
}

function createProceduralSounds() {
    audio.footstep = createNoiseBuffer(0.1, 200, 800);
    audio.breath = createNoiseBuffer(0.5, 100, 400);
    audio.heartbeat = createHeartbeatBuffer();
    audio.scream = createScreamBuffer();
    audio.door = createNoiseBuffer(0.3, 100, 600);
    audio.pickup = createPickupBuffer();
    audio.ambience = createAmbienceBuffer();
    audio.whisper = createWhisperBuffer();
    audio.creak = createCreakBuffer();
}

function createNoiseBuffer(duration, lowFreq, highFreq) {
    if (!audio.context) return null;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = lowFreq + Math.random() * (highFreq - lowFreq);
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.3;
    }
    return buffer;
}

function createHeartbeatBuffer() {
    if (!audio.context) return null;
    const duration = 0.3;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        data[i] = Math.sin(2 * Math.PI * 60 * t) * Math.exp(-t * 10) * 0.5;
    }
    return buffer;
}

function createScreamBuffer() {
    if (!audio.context) return null;
    const duration = 1.5;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 400 + Math.sin(t * 10) * 200;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.6;
    }
    return buffer;
}

function createPickupBuffer() {
    if (!audio.context) return null;
    const duration = 0.3;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 800 - t * 1000;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.3;
    }
    return buffer;
}

function createAmbienceBuffer() {
    if (!audio.context) return null;
    const duration = 4;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        data[i] = (Math.random() - 0.5) * 0.08 * Math.sin(t * 0.5);
    }
    return buffer;
}

function createWhisperBuffer() {
    if (!audio.context) return null;
    const duration = 1.5;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const noise = (Math.random() - 0.5) * 0.3;
        const mod = Math.sin(t * 8) * 0.5 + 0.5;
        data[i] = noise * mod * (1 - t / duration);
    }
    return buffer;
}

function createCreakBuffer() {
    if (!audio.context) return null;
    const duration = 0.8;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 100 + Math.sin(t * 5) * 50 + Math.random() * 100;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.4;
    }
    return buffer;
}

function playSound(buffer, volume = 1, loop = false) {
    if (!audio.context || !buffer) return;
    if (audio.context.state === 'suspended') audio.context.resume();
    const source = audio.context.createBufferSource();
    source.buffer = buffer;
    source.loop = loop;
    const gain = audio.context.createGain();
    gain.gain.value = volume * audio.masterVolume;
    source.connect(gain);
    gain.connect(audio.context.destination);
    source.start();
    return { source, gain };
}

// ============ الأحداث ============
function setupEvents() {
    window.addEventListener('keydown', e => {
        input.keys[e.code] = true;
        if (e.code === 'Escape') {
            if (gameState === 'playing') pauseGame();
            else if (gameState === 'paused') resumeGame();
        }
        if (e.code === 'KeyE' && gameState === 'playing') interact();
        if (e.code === 'KeyF' && gameState === 'playing') toggleFlashlight();
        if (e.code === 'KeyH' && gameState === 'playing') tryHide();
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.isRunning = true;
    });
    
    window.addEventListener('keyup', e => {
        input.keys[e.code] = false;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.isRunning = false;
    });
    
    const canvas = document.getElementById('gameCanvas');
    canvas.addEventListener('click', () => {
        if (gameState === 'playing' && !isMobile) canvas.requestPointerLock();
        if (audio.context && audio.context.state === 'suspended') audio.context.resume();
    });
    
    document.addEventListener('pointerlockchange', () => {
        input.mouse.locked = document.pointerLockElement === canvas;
    });
    
    document.addEventListener('mousemove', e => {
        if (input.mouse.locked && gameState === 'playing') {
            input.mouse.dx = e.movementX;
            input.mouse.dy = e.movementY;
            updatePlayerRotation();
        }
    });
    
    if (isMobile) setupMobileControls();
    
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 100));
    window.addEventListener('beforeunload', cleanupMemory);
}

function setupMobileControls() {
    document.getElementById('mobileControls').style.display = 'block';
    document.getElementById('fpsCounter').style.display = 'block';
    
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    let joystickCenter = { x: 0, y: 0 };
    const maxDistance = 50;
    
    joystick.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        const touch = e.changedTouches[0];
        input.joystick.touchId = touch.identifier;
        const rect = joystick.getBoundingClientRect();
        joystickCenter.x = rect.left + rect.width / 2;
        joystickCenter.y = rect.top + rect.height / 2;
        updateJoystick(touch.clientX, touch.clientY);
    }, { passive: false });
    
    joystick.addEventListener('touchmove', e => {
        e.preventDefault();
        e.stopPropagation();
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.joystick.touchId) {
                updateJoystick(touch.clientX, touch.clientY);
            }
        }
    }, { passive: false });
    
    const endJoystick = (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.joystick.touchId) {
                input.joystick.touchId = null;
                input.joystick.active = false;
                input.joystick.x = 0;
                input.joystick.y = 0;
                knob.style.transform = 'translate(-50%, -50%)';
            }
        }
    };
    
    joystick.addEventListener('touchend', endJoystick, { passive: false });
    joystick.addEventListener('touchcancel', endJoystick, { passive: false });
    
    function updateJoystick(clientX, clientY) {
        const dx = clientX - joystickCenter.x;
        const dy = clientY - joystickCenter.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const clampedDist = Math.min(dist, maxDistance);
        const angle = Math.atan2(dy, dx);
        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;
        knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        input.joystick.x = knobX / maxDistance;
        input.joystick.y = knobY / maxDistance;
        input.joystick.active = true;
    }
    
    document.addEventListener('touchstart', e => {
        for (let touch of e.changedTouches) {
            const target = touch.target;
            if (target.closest('#joystick') || target.closest('.actionButton') || target.closest('#pauseBtn') || target.closest('#fullscreenBtn')) continue;
            if (touch.clientX > window.innerWidth * 0.3 && input.look.touchId === null) {
                input.look.touchId = touch.identifier;
                input.look.lastX = touch.clientX;
                input.look.lastY = touch.clientY;
            }
        }
    }, { passive: false });
    
    document.addEventListener('touchmove', e => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.look.touchId) {
                const dx = touch.clientX - input.look.lastX;
                const dy = touch.clientY - input.look.lastY;
                const sensitivity = 0.006;
                player.rotation.y -= dx * sensitivity;
                player.rotation.x -= dy * sensitivity;
                player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
                input.look.lastX = touch.clientX;
                input.look.lastY = touch.clientY;
                updateCameraRotation();
                e.preventDefault();
            }
        }
    }, { passive: false });
    
    const endLook = (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.look.touchId) input.look.touchId = null;
        }
    };
    
    document.addEventListener('touchend', endLook, { passive: false });
    document.addEventListener('touchcancel', endLook, { passive: false });
    
    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            action();
            vibrate(20);
        }, { passive: false });
    };
    
    setupButton('btnInteract', interact);
    setupButton('btnFlashlight', toggleFlashlight);
    setupButton('btnHide', tryHide);
    
    const runBtn = document.getElementById('btnRun');
    runBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); player.isRunning = true; vibrate(15); }, { passive: false });
    runBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); player.isRunning = false; }, { passive: false });
    runBtn.addEventListener('touchcancel', e => { player.isRunning = false; }, { passive: false });
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) {
        composer.setSize(window.innerWidth, window.innerHeight);
    }
    if (bloomPass) {
        bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    }
}

function updatePlayerRotation() {
    const sensitivity = 0.002;
    player.rotation.y -= input.mouse.dx * sensitivity;
    player.rotation.x -= input.mouse.dy * sensitivity;
    player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
    input.mouse.dx = 0;
    input.mouse.dy = 0;
    updateCameraRotation();
}

function updateCameraRotation() {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.rotation.y;
    camera.rotation.x = player.rotation.x;
}

// ============ التفاعل ============
function interact() {
    if (!player.canInteract || !player.interactTarget) return;
    const target = player.interactTarget;
    if (target.type === 'door') interactDoor(target);
    else if (target.type === 'item') collectItem(target);
    else if (target.type === 'note') readNote(target);
    else if (target.type === 'puzzle') startPuzzle(target);
    else if (target.type === 'hide') enterHidingSpot(target);
}

function interactDoor(door) {
    const realDoor = house.doors.find(d => d.id === door.id);
    if (!realDoor) return;
    
    if (realDoor.locked) {
        const keyIndex = player.inventory.findIndex(i => i.id === realDoor.key);
        if (keyIndex >= 0) {
            player.inventory.splice(keyIndex, 1);
            realDoor.locked = false;
            updateInventoryUI();
            showMessage('🔓 تم فتح الباب بالمفتاح الصحيح!', 2000);
            playSound(audio.door, 0.5);
            vibrate([50, 30, 50]);
            realDoor.isOpen = true;
            animateDoor(realDoor);
            if (realDoor.id === 'exitDoor') setTimeout(() => winGame(), 2000);
        } else {
            let msg = 'الباب مغلق. تحتاج إلى مفتاح.';
            if (realDoor.id === 'door2') msg = '🔒 الباب يحتاج المفتاح الصدئ';
            else if (realDoor.id === 'door4') msg = '🔒 الباب يحتاج المفتاح النحاسي';
            else if (realDoor.id === 'exitDoor') msg = '🔒 باب الخروج يحتاج المفتاح الذهبي';
            showMessage(msg, 2500);
            playSound(audio.door, 0.3);
            vibrate(100);
        }
    } else {
        realDoor.isOpen = !realDoor.isOpen;
        animateDoor(realDoor);
        playSound(audio.door, 0.5);
    }
}

function animateDoor(door) {
    const targetRotation = door.isOpen ? Math.PI / 2 : 0;
    const startRotation = door.mesh.rotation.y - door.rotation;
    const startTime = Date.now();
    const duration = 500;
    function animate() {
        const elapsed = Date.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        door.mesh.rotation.y = door.rotation + startRotation + (targetRotation - startRotation) * eased;
        if (t < 1) requestAnimationFrame(animate);
    }
    animate();
}

function collectItem(item) {
    const realItem = house.items.find(i => i.id === item.id);
    if (!realItem || realItem.collected) return;
    if (player.inventory.length >= player.maxInventory) {
        showMessage('الحقيبة ممتلئة!', 2000);
        return;
    }
    
    if (realItem.type === 'battery') {
        player.battery = Math.min(player.maxBattery, player.battery + 50);
        updateBatteryUI();
        showMessage('🔋 تم شحن البطارية +50%', 2000);
    } else if (realItem.type === 'medkit') {
        player.health = Math.min(player.maxHealth, player.health + 40);
        updateHealthUI();
        showMessage('💊 تم استعادة الصحة +40', 2000);
    } else if (realItem.type === 'lighter') {
        showMessage('🔥 ولاعة! قد تكون مفيدة', 2000);
    } else if (realItem.type === 'tool') {
        showMessage('🔧 مفك براغي - أداة مفيدة', 2000);
    } else if (realItem.type === 'key') {
        let doorName = 'باب';
        if (realItem.door === 'door2') doorName = 'الباب الصدئ';
        else if (realItem.door === 'door4') doorName = 'الباب النحاسي';
        else if (realItem.door === 'exitDoor') doorName = 'باب الخروج';
        showMessage(`🗝️ ${realItem.name} - يفتح ${doorName}`, 2500);
    } else {
        showMessage(`التقطت: ${realItem.name}`, 2000);
    }
    
    player.inventory.push({
        id: realItem.id, name: realItem.name,
        icon: realItem.icon, type: realItem.type, door: realItem.door
    });
    
    realItem.collected = true;
    scene.remove(realItem.mesh);
    updateInventoryUI();
    playSound(audio.pickup, 0.5);
    vibrate(30);
}

function readNote(note) {
    const realNote = house.notes.find(n => n.id === note.id);
    if (!realNote || realNote.read) return;
    realNote.read = true;
    gameState = 'note';
    
    // تفعيل DOF عند قراءة الملاحظة
    player.targetFocusDistance = 2;
    
    const noteContent = document.getElementById('noteContent');
    noteContent.innerHTML = `<h3 style="color:#8b0000;margin-bottom:15px;">${realNote.title}</h3><p>${realNote.content.replace(/\n/g, '<br>')}</p><p style="margin-top:20px;font-size:0.8em;color:#666;">اضغط في أي مكان للإغلاق</p>`;
    document.getElementById('noteScreen').style.display = 'flex';
    
    const closeNote = () => {
        document.getElementById('noteScreen').style.display = 'none';
        gameState = 'playing';
        player.targetFocusDistance = 10;
        document.removeEventListener('click', closeNote);
        document.removeEventListener('touchstart', closeNote);
    };
    
    setTimeout(() => {
        document.addEventListener('click', closeNote);
        document.addEventListener('touchstart', closeNote);
    }, 100);
}

function startPuzzle(puzzle) {
    const realPuzzle = house.puzzles.find(p => p.id === puzzle.id);
    if (!realPuzzle) return;
    if (realPuzzle.solved) {
        showMessage('تم حل هذا اللغز بالفعل', 2000);
        return;
    }
    gameState = 'puzzle';
    const puzzleContent = document.getElementById('puzzleContent');
    
    if (realPuzzle.type === 'code') {
        puzzleContent.innerHTML = `
            <h2>🔐 لغز الرموز</h2>
            <p style="margin-bottom:15px;">${realPuzzle.hint}</p>
            <p style="margin-bottom:15px;color:#888;font-size:0.9em;">أدخل الرمز المكون من 4 أرقام:</p>
            <input type="text" class="puzzleInput" id="puzzleCodeInput" maxlength="4" placeholder="____">
            <div style="margin-top:15px;">
                <button class="puzzleButton" onclick="submitPuzzleCode('${realPuzzle.id}')">تأكيد</button>
                <button class="puzzleButton" onclick="closePuzzle()">إلغاء</button>
            </div>
            <div id="puzzleFeedback" style="margin-top:10px;color:#ff3333;"></div>
        `;
    } else if (realPuzzle.type === 'sequence') {
        puzzleContent.innerHTML = `
            <h2>🖼️ لغز الصور</h2>
            <p style="margin-bottom:15px;">${realPuzzle.hint}</p>
            <p style="margin-bottom:15px;color:#888;font-size:0.9em;">اضغط على الأرقام بالترتيب الصحيح:</p>
            <div style="display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap;">
                ${[1,2,3,4].map(n => `<button class="puzzleButton" style="width:60px;height:60px;font-size:1.5em;" onclick="selectPuzzleNumber(${n}, '${realPuzzle.id}')">${n}</button>`).join('')}
            </div>
            <div id="puzzleSequence" style="text-align:center;color:#ffcc00;font-size:1.2em;min-height:30px;"></div>
            <div style="margin-top:15px;text-align:center;">
                <button class="puzzleButton" onclick="resetPuzzleSequence('${realPuzzle.id}')">مسح</button>
                <button class="puzzleButton" onclick="closePuzzle()">إلغاء</button>
            </div>
            <div id="puzzleFeedback" style="margin-top:10px;color:#ff3333;text-align:center;"></div>
        `;
        realPuzzle.currentSequence = [];
    }
    document.getElementById('puzzleScreen').style.display = 'flex';
}

window.submitPuzzleCode = function(puzzleId) {
    const puzzle = house.puzzles.find(p => p.id === puzzleId);
    const input = document.getElementById('puzzleCodeInput').value;
    const feedback = document.getElementById('puzzleFeedback');
    if (input === puzzle.solution) {
        feedback.style.color = '#00ff00';
        feedback.textContent = '✓ تم! الباب مفتوح الآن';
        puzzle.solved = true;
        const door = house.doors.find(d => d.id === puzzle.reward);
        if (door) door.locked = false;
        vibrate([50, 30, 50, 30, 50]);
        setTimeout(() => { closePuzzle(); showMessage('تم حل اللغز!', 2000); }, 1500);
    } else {
        feedback.textContent = '✗ رمز خاطئ!';
        document.getElementById('puzzleCodeInput').value = '';
        killer.soundLevel = Math.min(100, killer.soundLevel + 30);
        vibrate(200);
    }
};

window.selectPuzzleNumber = function(num, puzzleId) {
    const puzzle = house.puzzles.find(p => p.id === puzzleId);
    if (puzzle.currentSequence.length >= 4) return;
    puzzle.currentSequence.push(num);
    document.getElementById('puzzleSequence').textContent = puzzle.currentSequence.join(' - ');
    if (puzzle.currentSequence.length === 4) {
        const correct = puzzle.currentSequence.every((v, i) => v - 1 === puzzle.solution[i]);
        const feedback = document.getElementById('puzzleFeedback');
        if (correct) {
            feedback.style.color = '#00ff00';
            feedback.textContent = '✓ تم! الباب مفتوح الآن';
            puzzle.solved = true;
            const door = house.doors.find(d => d.id === puzzle.reward);
            if (door) door.locked = false;
            vibrate([50, 30, 50, 30, 50]);
            setTimeout(() => { closePuzzle(); showMessage('تم حل اللغز!', 2000); }, 1500);
        } else {
            feedback.textContent = '✗ ترتيب خاطئ!';
            vibrate(200);
            setTimeout(() => { resetPuzzleSequence(puzzleId); feedback.textContent = ''; }, 1000);
            killer.soundLevel = Math.min(100, killer.soundLevel + 30);
        }
    }
};

window.resetPuzzleSequence = function(puzzleId) {
    const puzzle = house.puzzles.find(p => p.id === puzzleId);
    puzzle.currentSequence = [];
    document.getElementById('puzzleSequence').textContent = '';
};

window.closePuzzle = function() {
    document.getElementById('puzzleScreen').style.display = 'none';
    gameState = 'playing';
};

function tryHide() {
    if (player.isHiding) { exitHidingSpot(); return; }
    let nearest = null;
    let minDist = 2.5;
    house.hidingSpots.forEach(spot => {
        const dist = player.position.distanceTo(spot.position);
        if (dist < minDist && !spot.isOccupied) { minDist = dist; nearest = spot; }
    });
    if (nearest) enterHidingSpot(nearest);
    else showMessage('لا يوجد مكان للاختباء قريب', 1500);
}

function enterHidingSpot(spot) {
    player.isHiding = true;
    player.hidingSpot = spot;
    spot.isOccupied = true;
    player.savedPosition = player.position.clone();
    player.savedRotation = { x: player.rotation.x, y: player.rotation.y };
    player.position.copy(spot.position);
    if (spot.type === 'bed') {
        player.position.y = 0.3;
        camera.position.y = 0.3;
        player.rotation.x = 0;
    } else {
        player.position.y = 1.2;
        camera.position.y = 1.2;
    }
    document.getElementById('hideOverlay').style.opacity = '0.6';
    document.getElementById('hideVignette').style.opacity = '1';
    camera.fov = 50;
    camera.updateProjectionMatrix();
    if (player.flashlightOn) {
        player.flashlightOn = false;
        player.flashlight.intensity = 0;
    }
    playSound(audio.creak, 0.3);
    vibrate(50);
    showMessage(spot.type === 'bed' ? '🛏️ مختبئة تحت السرير... لا تتحركي' : '🚪 مختبئة في الخزانة... لا تتحركي', 2500);
}

function exitHidingSpot() {
    if (!player.isHiding) return;
    player.isHiding = false;
    player.hidingSpot.isOccupied = false;
    player.hidingSpot = null;
    if (player.savedPosition) {
        player.position.copy(player.savedPosition);
        player.position.y = player.height;
        player.rotation.x = player.savedRotation.x;
        player.rotation.y = player.savedRotation.y;
    } else {
        player.position.y = player.height;
    }
    camera.fov = player.originalFov;
    camera.updateProjectionMatrix();
    document.getElementById('hideOverlay').style.opacity = '0';
    document.getElementById('hideVignette').style.opacity = '0';
    playSound(audio.creak, 0.3);
    vibrate(30);
}

function toggleFlashlight() {
    if (player.isHiding) {
        showMessage('لا يمكنك تشغيل المصباح وأنت مختبئة!', 1500);
        return;
    }
    player.flashlightOn = !player.flashlightOn;
    player.flashlight.intensity = player.flashlightOn ? 3 : 0;
    if (!player.flashlightOn) {
        showMessage('🔦 المصباح مطفي - البطارية تشحن...', 1500);
    } else {
        if (player.battery <= 0) {
            player.flashlightOn = false;
            player.flashlight.intensity = 0;
            showMessage('البطارية فارغة! أطفئي المصباح لشحنها', 2000);
        }
    }
    vibrate(20);
}

// ============ حركة اللاعب ============
let fpsFrames = 0, fpsTime = 0;

function updatePlayer(delta) {
    // FPS counter
    fpsFrames++;
    fpsTime += delta;
    if (fpsTime >= 1) {
        document.getElementById('fpsCounter').textContent = 'FPS: ' + fpsFrames;
        fpsFrames = 0;
        fpsTime = 0;
    }
    
    if (!player.flashlightOn && player.battery < player.maxBattery) {
        player.battery = Math.min(player.maxBattery, player.battery + diffSettings.batteryCharge * delta);
        updateBatteryUI();
        document.getElementById('batteryBar').classList.add('charging');
        document.getElementById('batteryStatus').textContent = '(يشحن...)';
    } else {
        document.getElementById('batteryBar').classList.remove('charging');
        document.getElementById('batteryStatus').textContent = '';
    }
    
    if (player.isHiding) {
        updateHidingBehavior(delta);
        updateDangerIndicator();
        return;
    }
    
    let moveX = 0, moveZ = 0;
    if (input.keys['KeyW'] || input.keys['ArrowUp']) moveZ -= 1;
    if (input.keys['KeyS'] || input.keys['ArrowDown']) moveZ += 1;
    if (input.keys['KeyA'] || input.keys['ArrowLeft']) moveX -= 1;
    if (input.keys['KeyD'] || input.keys['ArrowRight']) moveX += 1;
    if (input.joystick.active) { moveX = input.joystick.x; moveZ = input.joystick.y; }
    if (Math.abs(moveX) < 0.15) moveX = 0;
    if (Math.abs(moveZ) < 0.15) moveZ = 0;
    
    const isMoving = moveX !== 0 || moveZ !== 0;
    const isRunning = player.isRunning && player.stamina > 0 && isMoving;
    const speed = isRunning ? player.runSpeed : player.speed;
    
    if (isRunning) player.stamina = Math.max(0, player.stamina - 18 * delta);
    else player.stamina = Math.min(player.maxStamina, player.stamina + 12 * delta);
    updateStaminaUI();
    
    const mag = Math.sqrt(moveX * moveX + moveZ * moveZ);
    if (mag > 1) { moveX /= mag; moveZ /= mag; }
    
    const forward = new THREE.Vector3(-Math.sin(player.rotation.y), 0, -Math.cos(player.rotation.y));
    const right = new THREE.Vector3(Math.cos(player.rotation.y), 0, -Math.sin(player.rotation.y));
    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -moveZ);
    moveDir.addScaledVector(right, moveX);
    
    const newPos = player.position.clone();
    newPos.x += moveDir.x * speed * delta;
    newPos.z += moveDir.z * speed * delta;
    
    if (!checkCollision(newPos)) player.position.copy(newPos);
    else {
        const tryX = player.position.clone();
        tryX.x += moveDir.x * speed * delta;
        if (!checkCollision(tryX)) player.position.x = tryX.x;
        const tryZ = player.position.clone();
        tryZ.z += moveDir.z * speed * delta;
        if (!checkCollision(tryZ)) player.position.z = tryZ.z;
    }
    
    player.position.x = Math.max(-14, Math.min(14, player.position.x));
    player.position.z = Math.max(-14, Math.min(14, player.position.z));
    
    if (isMoving) {
        player.headBob += delta * (isRunning ? 11 : 7);
        const bobAmount = isRunning ? 0.07 : 0.04;
        camera.position.y = player.height + Math.sin(player.headBob) * bobAmount;
        const stepPhase = Math.sin(player.headBob);
        if (stepPhase > 0.95 && Math.sin(player.headBob - delta * 7) <= 0.95) {
            playSound(audio.footstep, isRunning ? 0.35 : 0.2);
            killer.soundLevel = Math.min(100, killer.soundLevel + (isRunning ? 18 : 6));
        }
    } else {
        camera.position.y = player.height;
    }
    
    camera.position.x = player.position.x;
    camera.position.z = player.position.z;
    
    if (player.flashlightOn) {
        player.battery = Math.max(0, player.battery - diffSettings.batteryDrain * delta);
        updateBatteryUI();
        if (player.battery <= 0) {
            player.flashlightOn = false;
            player.flashlight.intensity = 0;
            showMessage('⚠️ نفدت البطارية! أطفئي المصباح لشحنها', 2500);
            vibrate([100, 50, 100]);
        }
    }
    
    checkInteraction();
    checkScareEvents();
    updateDangerIndicator();
    
    // Smooth focus distance transition
    player.focusDistance += (player.targetFocusDistance - player.focusDistance) * delta * 3;
}

function updateDangerIndicator() {
    const distToKiller = killer.position.distanceTo(player.position);
    const dangerIndicator = document.getElementById('dangerIndicator');
    if (distToKiller < 8 && killer.state !== 'patrol') {
        const intensity = Math.max(0, 1 - distToKiller / 8);
        dangerIndicator.style.opacity = intensity;
        if (killer.state === 'chase') {
            dangerIndicator.classList.add('active');
            if (Math.random() < 0.02) vibrate(50);
        } else {
            dangerIndicator.classList.remove('active');
        }
    } else {
        dangerIndicator.style.opacity = 0;
        dangerIndicator.classList.remove('active');
    }
}

function updateHidingBehavior(delta) {
    player.hideBreathTimer += delta;
    if (player.hideBreathTimer > 3) {
        player.hideBreathTimer = 0;
        if (audio.breath) playSound(audio.breath, 0.15);
    }
    const shakeAmount = 0.005;
    camera.position.x = player.position.x + (Math.random() - 0.5) * shakeAmount;
    camera.position.z = player.position.z + (Math.random() - 0.5) * shakeAmount;
    const distToKiller = killer.position.distanceTo(player.position);
    if (distToKiller < 5) {
        player.heartbeat += delta * 2;
        if (Math.sin(player.heartbeat * Math.PI * 2) > 0.95) {
            playSound(audio.heartbeat, 0.4);
            if (Math.random() < 0.3) vibrate(30);
        }
    }
}

function checkScareEvents() {
    house.scareEvents.forEach(event => {
        if (event.triggered) return;
        const dist = player.position.distanceTo(event.position);
        if (dist < event.radius) {
            event.triggered = true;
            triggerScareEvent(event);
        }
    });
}

function triggerScareEvent(event) {
    if (event.type === 'doll' || event.type === 'body') {
        const flash = document.getElementById('scareFlash');
        flash.style.opacity = '0.3';
        setTimeout(() => { flash.style.opacity = '0'; }, 100);
        if (audio.whisper) playSound(audio.whisper, 0.4);
        player.fear = Math.min(100, player.fear + 30);
        shakeCamera(0.2);
        vibrate([100, 50, 100, 50, 200]);
    }
}

function checkCollision(pos) {
    const playerBox = new THREE.Box3(
        new THREE.Vector3(pos.x - player.radius, pos.y - player.height + 0.1, pos.z - player.radius),
        new THREE.Vector3(pos.x + player.radius, pos.y + 0.1, pos.z + player.radius)
    );
    for (let obj of house.collisions) {
        const objBox = new THREE.Box3().setFromObject(obj);
        if (playerBox.intersectsBox(objBox)) return true;
    }
    return false;
}

function checkInteraction() {
    player.canInteract = false;
    player.interactTarget = null;
    const hint = document.getElementById('interactionHint');
    let nearestDist = Infinity;
    let nearestTarget = null;
    let nearestHint = '';
    
    for (let door of house.doors) {
        const dist = player.position.distanceTo(door.position);
        if (dist < 2.5 && dist < nearestDist) {
            nearestDist = dist;
            nearestTarget = { type: 'door', id: door.id };
            if (door.locked) {
                let keyHint = '';
                if (door.key === 'key1') keyHint = ' (المفتاح الصدئ)';
                else if (door.key === 'key2') keyHint = ' (المفتاح النحاسي)';
                else if (door.key === 'exitKey') keyHint = ' (مفتاح الخروج)';
                nearestHint = `🔒 الباب مغلق${keyHint} (E)`;
            } else {
                nearestHint = door.isOpen ? 'إغلاق الباب (E)' : 'فتح الباب (E)';
            }
        }
    }
    
    for (let item of house.items) {
        if (item.collected) continue;
        const dist = player.position.distanceTo(item.position);
        if (dist < 2.2 && dist < nearestDist) {
            nearestDist = dist;
            nearestTarget = { type: 'item', id: item.id };
            nearestHint = `التقط ${item.name} (E)`;
        }
    }
    
    for (let note of house.notes) {
        if (note.read) continue;
        const dist = player.position.distanceTo(note.position);
        if (dist < 2 && dist < nearestDist) {
            nearestDist = dist;
            nearestTarget = { type: 'note', id: note.id };
            nearestHint = `اقرأ ${note.title} (E)`;
        }
    }
    
    for (let puzzle of house.puzzles) {
        if (puzzle.solved) continue;
        const dist = player.position.distanceTo(puzzle.position);
        if (dist < 2.5 && dist < nearestDist) {
            nearestDist = dist;
            nearestTarget = { type: 'puzzle', id: puzzle.id };
            nearestHint = 'افحص اللغز (E)';
        }
    }
    
    if (!player.isHiding) {
        for (let spot of house.hidingSpots) {
            if (spot.isOccupied) continue;
            const dist = player.position.distanceTo(spot.position);
            if (dist < 2.2 && dist < nearestDist) {
                nearestDist = dist;
                nearestTarget = { type: 'hide', id: spot.id };
                nearestHint = spot.type === 'bed' ? 'اختبئ تحت السرير (H)' : 'اختبئ في الخزانة (H)';
            }
        }
    }
    
    if (nearestTarget) {
        player.canInteract = true;
        player.interactTarget = nearestTarget;
        hint.textContent = nearestHint;
        hint.classList.add('show');
    } else {
        hint.classList.remove('show');
    }
}

// ============ ذكاء القاتل ============
function updateKiller(delta) {
    killer.animationTime += delta;
    killer.soundLevel = Math.max(0, killer.soundLevel - 5 * delta);
    const distToPlayer = killer.position.distanceTo(player.position);
    let awarenessChange = 0;
    
    if (!player.isHiding) {
        const toPlayer = new THREE.Vector3().subVectors(player.position, killer.position).normalize();
        const killerForward = new THREE.Vector3(0, 0, 1).applyQuaternion(killer.mesh.quaternion);
        const dot = toPlayer.dot(killerForward);
        if (dot > Math.cos(killer.fieldOfView / 2) && distToPlayer < killer.sightRange) {
            if (hasLineOfSight(killer.position, player.position)) {
                const visibility = player.flashlightOn ? 1.5 : 1;
                awarenessChange += 50 * delta * visibility * (1 - distToPlayer / killer.sightRange) * diffSettings.awarenessGain;
            }
        }
    }
    
    if (killer.soundLevel > 0 && distToPlayer < killer.hearingRange) {
        const hearingMult = player.isHiding ? 0.3 : 1;
        awarenessChange += killer.soundLevel * 0.5 * delta * (1 - distToPlayer / killer.hearingRange) * hearingMult;
    }
    
    killer.awareness = Math.max(0, Math.min(100, killer.awareness + awarenessChange - 3 * delta));
    
    if (killer.awareness >= 80 && !player.isHiding) {
        if (killer.state !== 'chase') {
            killer.state = 'chase';
            vibrate([150, 50, 150]);
        }
        killer.lastKnownPlayerPos = player.position.clone();
    } else if (killer.awareness >= 40) {
        killer.state = 'search';
        killer.searchTimer = 5;
        if (!killer.lastKnownPlayerPos) killer.lastKnownPlayerPos = player.position.clone();
    } else {
        if (killer.state === 'search') {
            killer.searchTimer -= delta;
            if (killer.searchTimer <= 0) killer.state = 'patrol';
        } else if (killer.state !== 'chase') {
            killer.state = 'patrol';
        }
    }
    
    switch (killer.state) {
        case 'patrol': patrolBehavior(delta); break;
        case 'search': searchBehavior(delta); break;
        case 'chase': chaseBehavior(delta); break;
    }
    
    if (distToPlayer < 1.8 && !player.isHiding) {
        if (killer.attackCooldown <= 0) {
            attackPlayer();
            killer.attackCooldown = 2;
        }
    }
    killer.attackCooldown = Math.max(0, killer.attackCooldown - delta);
    
    killer.mesh.position.copy(killer.position);
    
    if (killer.velocity.length() > 0.05) {
        const targetAngle = Math.atan2(killer.velocity.x, killer.velocity.z);
        let angleDiff = targetAngle - killer.mesh.rotation.y;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        killer.mesh.rotation.y += angleDiff * 5 * delta;
    }
    
    const walkSpeed = killer.state === 'chase' ? 10 : 5;
    killer.mesh.children.forEach((child, i) => {
        if (i === 6 || i === 7) child.rotation.x = Math.sin(killer.animationTime * walkSpeed) * 0.5;
        if (i === 8 || i === 9) child.rotation.x = Math.sin(killer.animationTime * walkSpeed + (i === 9 ? Math.PI : 0)) * 0.5;
    });
    
    killer.light.intensity = killer.state === 'chase' ? 1.2 : killer.state === 'search' ? 0.6 : 0.3;
}

function hasLineOfSight(from, to) {
    const dir = new THREE.Vector3().subVectors(to, from).normalize();
    const dist = from.distanceTo(to);
    const raycaster = new THREE.Raycaster(from.clone().setY(1.5), dir, 0, dist);
    const intersects = raycaster.intersectObjects(house.collisions);
    return intersects.length === 0;
}

function patrolBehavior(delta) {
    const target = killer.patrolPoints[killer.currentPatrolIndex];
    const dir = new THREE.Vector3().subVectors(target, killer.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist < 1) {
        killer.currentPatrolIndex = (killer.currentPatrolIndex + 1) % killer.patrolPoints.length;
    } else {
        dir.normalize();
        killer.velocity.copy(dir.multiplyScalar(killer.speed * delta));
        const newPos = killer.position.clone().add(killer.velocity);
        if (!checkKillerCollision(newPos)) killer.position.copy(newPos);
        else killer.currentPatrolIndex = (killer.currentPatrolIndex + 1) % killer.patrolPoints.length;
    }
}

function searchBehavior(delta) {
    if (!killer.lastKnownPlayerPos) { killer.state = 'patrol'; return; }
    const dir = new THREE.Vector3().subVectors(killer.lastKnownPlayerPos, killer.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist < 1) {
        const randomOffset = new THREE.Vector3((Math.random() - 0.5) * 4, 0, (Math.random() - 0.5) * 4);
        killer.lastKnownPlayerPos.add(randomOffset);
        killer.lastKnownPlayerPos.x = Math.max(-13, Math.min(13, killer.lastKnownPlayerPos.x));
        killer.lastKnownPlayerPos.z = Math.max(-13, Math.min(13, killer.lastKnownPlayerPos.z));
    } else {
        dir.normalize();
        killer.velocity.copy(dir.multiplyScalar(killer.speed * 0.8 * delta));
        const newPos = killer.position.clone().add(killer.velocity);
        if (!checkKillerCollision(newPos)) killer.position.copy(newPos);
        else killer.lastKnownPlayerPos = killer.patrolPoints[Math.floor(Math.random() * killer.patrolPoints.length)].clone();
    }
}

function chaseBehavior(delta) {
    const dir = new THREE.Vector3().subVectors(player.position, killer.position);
    dir.y = 0;
    dir.normalize();
    killer.velocity.copy(dir.multiplyScalar(killer.chaseSpeed * delta));
    const newPos = killer.position.clone().add(killer.velocity);
    if (!checkKillerCollision(newPos)) killer.position.copy(newPos);
    if (!player.isHiding) killer.lastKnownPlayerPos = player.position.clone();
}

function checkKillerCollision(pos) {
    const killerBox = new THREE.Box3(
        new THREE.Vector3(pos.x - 0.4, 0, pos.z - 0.4),
        new THREE.Vector3(pos.x + 0.4, 2.5, pos.z + 0.4)
    );
    for (let obj of house.collisions) {
        const objBox = new THREE.Box3().setFromObject(obj);
        if (killerBox.intersectsBox(objBox)) return true;
    }
    return false;
}

function attackPlayer() {
    player.health -= diffSettings.damage;
    updateHealthUI();
    document.getElementById('damageOverlay').style.opacity = '0.8';
    setTimeout(() => { document.getElementById('damageOverlay').style.opacity = '0'; }, 300);
    playSound(audio.scream, 0.7);
    shakeCamera(0.5);
    vibrate([200, 100, 300]);
    if (player.health <= 0) gameOver();
}

function shakeCamera(intensity) {
    const startTime = Date.now();
    const duration = 500;
    const originalPos = player.position.clone();
    function shake() {
        const elapsed = Date.now() - startTime;
        if (elapsed > duration || gameState !== 'playing') return;
        const t = 1 - elapsed / duration;
        camera.position.x = originalPos.x + (Math.random() - 0.5) * intensity * t;
        camera.position.z = originalPos.z + (Math.random() - 0.5) * intensity * t;
        requestAnimationFrame(shake);
    }
    shake();
}

// ============ التحديثات ============
function updateParticles(delta) {
    house.particles.forEach(p => {
        const positions = p.mesh.geometry.attributes.position.array;
        for (let i = 0; i < p.count; i++) {
            positions[i * 3] += p.velocities[i].x;
            positions[i * 3 + 1] += p.velocities[i].y;
            positions[i * 3 + 2] += p.velocities[i].z;
            if (p.isBlood) {
                if (positions[i * 3 + 1] < 0) {
                    positions[i * 3] = (Math.random() - 0.5) * 28;
                    positions[i * 3 + 1] = 5.5 + Math.random();
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 28;
                }
            } else {
                if (positions[i * 3 + 1] < 0 || positions[i * 3 + 1] > 5.5) {
                    positions[i * 3] = (Math.random() - 0.5) * 28;
                    positions[i * 3 + 1] = Math.random() * 5.5;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 28;
                }
                if (Math.abs(positions[i * 3]) > 14) positions[i * 3] *= -0.9;
                if (Math.abs(positions[i * 3 + 2]) > 14) positions[i * 3 + 2] *= -0.9;
            }
        }
        p.mesh.geometry.attributes.position.needsUpdate = true;
    });
}

let damageEffect = 0;

function updateLighting(delta, time) {
    house.lights.forEach(l => {
        l.flicker += delta;
        const flicker = Math.sin(l.flicker * 10) * 0.1 + Math.sin(l.flicker * 23) * 0.05;
        l.light.intensity = l.baseIntensity + flicker;
        if (l.isCandle && l.flame) {
            l.flame.scale.y = 1.5 + Math.sin(time * 15 + l.flicker) * 0.3;
            l.flame.scale.x = 1 + Math.sin(time * 12 + l.flicker) * 0.1;
        }
    });
    
    if (house.emergencyLight) {
        const emergencyPulse = Math.sin(time * 2) * 0.5 + 0.5;
        if (killer.state === 'chase') house.emergencyLight.intensity = emergencyPulse * 0.7;
        else if (killer.state === 'search') house.emergencyLight.intensity = emergencyPulse * 0.3;
        else house.emergencyLight.intensity = 0;
    }
    
    if (player.flashlightOn && player.battery < 30) {
        const flicker = Math.random();
        if (flicker > 0.95) {
            player.flashlight.intensity = 0;
            setTimeout(() => {
                if (player.flashlightOn && gameState === 'playing') player.flashlight.intensity = 3;
            }, 50);
        }
    }
    
    if (killer.state === 'chase') player.fear = Math.min(100, player.fear + 50 * delta);
    else if (killer.state === 'search') player.fear = Math.min(70, player.fear + 20 * delta);
    else player.fear = Math.max(0, player.fear - 10 * delta);
    
    if (player.fear > 30) {
        player.heartbeat += delta * (1 + player.fear / 50);
        if (Math.sin(player.heartbeat * Math.PI * 2) > 0.95) {
            playSound(audio.heartbeat, 0.3 * (player.fear / 100));
        }
        const heartbeatEl = document.getElementById('heartbeat');
        const beat = Math.sin(player.heartbeat * Math.PI * 2);
        if (beat > 0.9) {
            heartbeatEl.style.border = `${5 * (player.fear / 100)}px solid rgba(139, 0, 0, ${0.3 * (player.fear / 100)})`;
        } else {
            heartbeatEl.style.border = '0 solid rgba(139, 0, 0, 0)';
        }
    }
    
    if (Math.random() < 0.001 && audio.whisper && !player.isHiding) playSound(audio.whisper, 0.2);
    if (Math.random() < 0.002 && audio.creak) playSound(audio.creak, 0.15);
    
    // Damage effect decay
    damageEffect = Math.max(0, damageEffect - delta * 2);
}

function updateItems(time) {
    house.items.forEach(item => {
        if (item.collected) return;
        item.itemMesh.rotation.y = time * 1.5;
        item.itemMesh.position.y = Math.sin(time * 1.5) * 0.03;
        const pulse = (Math.sin(time * 2) + 1) / 2;
        item.glow.material.opacity = 0.05 + pulse * 0.05;
        item.glow.scale.setScalar(1 + pulse * 0.1);
    });
}

// ============ الواجهة ============
function updateHealthUI() {
    document.getElementById('healthFill').style.width = Math.max(0, player.health) + '%';
}
function updateStaminaUI() {
    document.getElementById('staminaFill').style.width = player.stamina + '%';
}
function updateBatteryUI() {
    document.getElementById('batteryFill').style.width = player.battery + '%';
}
function updateInventoryUI() {
    for (let i = 0; i < 6; i++) {
        const slot = document.getElementById('slot' + i);
        if (player.inventory[i]) {
            slot.textContent = player.inventory[i].icon;
            slot.classList.add('hasItem');
        } else {
            slot.textContent = '';
            slot.classList.remove('hasItem');
        }
    }
}
function showMessage(text, duration = 2000) {
    const msg = document.getElementById('messageBox');
    msg.textContent = text;
    msg.classList.add('show');
    clearTimeout(msg.hideTimeout);
    msg.hideTimeout = setTimeout(() => { msg.classList.remove('show'); }, duration);
}

// ============ حالة اللعبة ============
window.startGame = function() {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('gameUI').style.display = 'block';
    gameState = 'playing';
    applyDifficulty();
    const diffDisplay = document.getElementById('difficultyDisplay');
    diffDisplay.textContent = diffSettings.name + ' | ' + gfxSettings.name;
    diffDisplay.style.color = diffSettings.color;
    diffDisplay.style.borderColor = diffSettings.color;
    player.position.set(0, player.height, 12);
    player.health = 100;
    player.stamina = 100;
    player.battery = 100;
    player.inventory = [];
    player.isHiding = false;
    player.flashlightOn = true;
    player.flashlight.intensity = 3;
    player.rotation.x = 0;
    player.rotation.y = 0;
    player.fear = 0;
    camera.fov = player.originalFov;
    camera.updateProjectionMatrix();
    updateHealthUI();
    updateStaminaUI();
    updateBatteryUI();
    updateInventoryUI();
    updateCameraRotation();
    setTimeout(() => showMessage('أنت محاصرة في منزل الظلام...', 3000), 500);
    setTimeout(() => showMessage('اختبئي عندما يقترب... أطفئي المصباح لشحن البطارية', 4000), 4000);
    if (audio.context && audio.context.state === 'suspended') audio.context.resume();
    if (audio.ambience) playSound(audio.ambience, 0.25, true);
    vibrate(100);
};

window.pauseGame = function() {
    if (gameState !== 'playing') return;
    gameState = 'paused';
    document.getElementById('pauseMenu').style.display = 'flex';
    if (document.pointerLockElement) document.exitPointerLock();
};

window.resumeGame = function() {
    gameState = 'playing';
    document.getElementById('pauseMenu').style.display = 'none';
};

window.restartGame = function() {
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('pauseMenu').style.display = 'none';
    document.getElementById('gameOverTitle').textContent = 'انتهت اللعبة';
    document.getElementById('gameOverTitle').style.color = '#8b0000';
    killer.position.set(12, 0, -12);
    killer.state = 'patrol';
    killer.awareness = 0;
    killer.currentPatrolIndex = 0;
    house.doors.forEach(d => {
        if (d.key !== null) d.locked = true;
        d.isOpen = false;
        d.mesh.rotation.y = d.rotation;
    });
    house.puzzles.forEach(p => { p.solved = false; p.currentSequence = []; });
    house.items.forEach(item => {
        if (item.collected) { item.collected = false; scene.add(item.mesh); }
    });
    house.notes.forEach(note => note.read = false);
    house.scareEvents.forEach(e => e.triggered = false);
    startGame();
};

window.quitToMenu = function() {
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('pauseMenu').style.display = 'none';
    document.getElementById('gameUI').style.display = 'none';
    document.getElementById('mainMenu').style.display = 'flex';
    document.getElementById('gameOverTitle').textContent = 'انتهت اللعبة';
    document.getElementById('gameOverTitle').style.color = '#8b0000';
    gameState = 'menu';
    if (document.pointerLockElement) document.exitPointerLock();
    cleanupMemory();
    setTimeout(() => { initAudio(); }, 100);
};

function gameOver() {
    gameState = 'gameover';
    document.getElementById('gameOver').style.display = 'flex';
    document.getElementById('gameOverText').textContent = 'لقد أمسك بك القاتل... لم تتمكني من الهروب من منزل الظلام.';
    if (document.pointerLockElement) document.exitPointerLock();
    vibrate([500, 200, 500]);
}

function winGame() {
    gameState = 'gameover';
    document.getElementById('gameOver').style.display = 'flex';
    document.getElementById('gameOverTitle').textContent = 'لقد هربتِ!';
    document.getElementById('gameOverTitle').style.color = '#00aa00';
    document.getElementById('gameOverText').textContent = 'لقد تمكنتِ من الهروب من منزل الظلام! أنتِ حرة الآن... لكن الذكريات ستطاردك للأبد.';
    if (document.pointerLockElement) document.exitPointerLock();
    vibrate([100, 50, 100, 50, 100, 50, 300]);
}

// ============ الحلقة الرئيسية ============
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    const time = clock.getElapsedTime();
    
    if (gameState === 'playing') {
        updatePlayer(delta);
        updateKiller(delta);
        updateParticles(delta);
        updateLighting(delta, time);
        updateItems(time);
    }
    
    // تحديث cinematic shader uniforms
    if (cinematicPass) {
        cinematicPass.uniforms.time.value = time;
        cinematicPass.uniforms.fear.value = player.fear / 100;
        cinematicPass.uniforms.damage.value = damageEffect;
        // DOF ديناميكي
        const dofTarget = player.isHiding ? 0.3 : (gameState === 'note' ? 0.8 : 0.0);
        const currentDof = cinematicPass.uniforms.dofStrength.value;
        cinematicPass.uniforms.dofStrength.value += (dofTarget - currentDof) * delta * 3;
    }
    
    // Render
    if (composer) {
        composer.render();
    } else {
        renderer.render(scene, camera);
    }
}
