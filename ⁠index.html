<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>منزل الظلام - Dark House Cinematic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; }
html, body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; width: 100%; height: 100%; position: fixed; }
#gameCanvas { width: 100vw; height: 100vh; display: block; cursor: none; touch-action: none; }

#mainMenu { position: fixed; inset: 0; background: radial-gradient(circle, #1a0000 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
#mainMenu h1 { font-size: clamp(2em, 8vw, 4em); color: #8b0000; text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000; margin-bottom: 20px; letter-spacing: 5px; animation: flicker 3s infinite; }
#mainMenu .subtitle { color: #666; font-size: 1.2em; margin-bottom: 30px; font-style: italic; }
#mainMenu .cinematic-badge { color: #ffaa00; font-size: 0.9em; letter-spacing: 3px; margin-bottom: 20px; text-shadow: 0 0 10px #ffaa00; }
.menuButton { background: linear-gradient(135deg, #2a0000, #000); color: #ff3333; border: 2px solid #8b0000; padding: 12px 40px; font-size: 1.2em; margin: 8px; cursor: pointer; font-family: inherit; letter-spacing: 3px; transition: all 0.3s; min-width: 250px; }
.menuButton:hover, .menuButton:active { background: #8b0000; color: #fff; box-shadow: 0 0 30px #ff0000; }
@keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } 52% { opacity: 0.4; } 54% { opacity: 1; } }

.difficultySection { margin: 20px 0; text-align: center; }
.difficultySection h3 { color: #8b0000; margin-bottom: 15px; font-size: 1.1em; letter-spacing: 2px; }
.difficultyButtons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.diffBtn { background: #1a0000; color: #ff6666; border: 2px solid #550000; padding: 10px 20px; cursor: pointer; font-family: inherit; transition: all 0.3s; min-width: 90px; }
.diffBtn.selected { background: #8b0000; color: #fff; border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

.graphicsSection { margin: 15px 0; text-align: center; }
.graphicsSection h3 { color: #ffaa00; margin-bottom: 10px; font-size: 1em; letter-spacing: 2px; }
.graphicsButtons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.gfxBtn { background: #1a1000; color: #ffaa66; border: 2px solid #553300; padding: 8px 15px; cursor: pointer; font-family: inherit; transition: all 0.3s; font-size: 0.85em; }
.gfxBtn.selected { background: #8b5500; color: #fff; border-color: #ffaa00; box-shadow: 0 0 15px rgba(255,170,0,0.5); }

#gameUI { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.4); }
#crosshair::before { width: 2px; height: 6px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
#crosshair::after { width: 6px; height: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

#interactionHint { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 1.1em; text-shadow: 0 0 10px #000; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 5px; border: 1px solid rgba(255,204,0,0.3); white-space: nowrap; }
#interactionHint.show { opacity: 1; }

#objective { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.95em; background: rgba(0,0,0,0.75); padding: 10px 18px; border-left: 3px solid #8b0000; max-width: 300px; }
#objective .title { color: #ff3333; font-size: 0.75em; letter-spacing: 2px; margin-bottom: 4px; }

#inventory { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.invSlot { width: 55px; height: 55px; background: rgba(0,0,0,0.75); border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 1.8em; color: #fff; border-radius: 4px; }
.invSlot.hasItem { border-color: #ffcc00; box-shadow: 0 0 12px rgba(255,204,0,0.6); }

.barContainer { position: absolute; right: 15px; width: 180px; }
.barContainer .label { color: #fff; font-size: 0.75em; margin-bottom: 3px; text-shadow: 0 0 5px #000; }
.bar { width: 100%; height: 8px; background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 2px; overflow: hidden; }
.barFill { height: 100%; transition: width 0.3s; }
#healthBar { top: 15px; }
#healthBar .barFill { background: linear-gradient(90deg, #8b0000, #ff0000); }
#staminaBar { top: 55px; }
#staminaBar .barFill { background: linear-gradient(90deg, #006600, #00ff00); }
#batteryBar { top: 95px; }
#batteryBar .barFill { background: linear-gradient(90deg, #ccaa00, #ffff00); }
#batteryBar.charging .barFill { background: linear-gradient(90deg, #00aa00, #00ff00); animation: chargePulse 1s infinite; }
@keyframes chargePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

#mobileControls { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 110; }
#joystick { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; pointer-events: auto; touch-action: none; }
#joystickKnob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; }

.actionButton { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 0.75em; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; font-weight: bold; text-align: center; }
#btnInteract { bottom: 130px; right: 30px; background: rgba(255,204,0,0.3); border-color: #ffcc00; }
#btnFlashlight { bottom: 220px; right: 30px; background: rgba(255,255,0,0.3); border-color: #ffff00; }
#btnHide { bottom: 130px; right: 115px; background: rgba(100,100,255,0.3); border-color: #6666ff; }
#btnRun { bottom: 220px; right: 115px; background: rgba(255,100,100,0.3); border-color: #ff6666; }
.actionButton:active { transform: scale(0.9); }

#damageOverlay { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 30%, rgba(139,0,0,0.85) 100%); opacity: 0; transition: opacity 0.3s; z-index: 51; }
#hideOverlay { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity 0.5s; z-index: 52; }
#heartbeat { position: absolute; inset: 0; pointer-events: none; border: 0 solid rgba(139,0,0,0); z-index: 53; transition: border 0.1s; }
#hideVignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 5%, rgba(0,0,0,0.95) 25%); opacity: 0; transition: opacity 0.5s; z-index: 54; }

#dangerIndicator { position: absolute; inset: 0; pointer-events: none; z-index: 55; opacity: 0; transition: opacity 0.3s; }
#dangerIndicator.active { animation: dangerPulse 1.2s infinite; }
@keyframes dangerPulse { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
.dangerEdge { position: absolute; background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.6) 100%); }
.dangerEdge.top { top: 0; left: 0; right: 0; height: 80px; }
.dangerEdge.bottom { bottom: 0; left: 0; right: 0; height: 80px; }
.dangerEdge.left { top: 0; bottom: 0; left: 0; width: 80px; }
.dangerEdge.right { top: 0; bottom: 0; right: 0; width: 80px; }

#messageBox { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 1.3em; text-align: center; text-shadow: 0 0 10px #000; opacity: 0; transition: opacity 0.5s; z-index: 200; background: rgba(0,0,0,0.85); padding: 18px 35px; border: 1px solid #8b0000; max-width: 80%; border-radius: 4px; }
#messageBox.show { opacity: 1; }

#gameOver { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
#gameOver h1 { color: #8b0000; font-size: clamp(2.5em, 8vw, 5em); text-shadow: 0 0 30px #ff0000; margin-bottom: 30px; }
#gameOver p { color: #aaa; font-size: 1.1em; margin-bottom: 30px; max-width: 600px; text-align: center; padding: 0 20px; }

#puzzleScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 300; padding: 20px; }
#puzzleContent { background: #1a1a1a; border: 2px solid #8b0000; padding: 25px; max-width: 500px; width: 100%; color: #fff; border-radius: 5px; }
#puzzleContent h2 { color: #ff3333; margin-bottom: 15px; }
.puzzleInput { background: #000; border: 1px solid #444; color: #fff; padding: 10px; font-size: 1.2em; width: 100%; margin: 10px 0; font-family: inherit; text-align: center; letter-spacing: 5px; }
.puzzleButton { background: #8b0000; color: #fff; border: none; padding: 10px 25px; font-size: 1em; cursor: pointer; margin: 5px; font-family: inherit; border-radius: 3px; }
.puzzleButton:hover, .puzzleButton:active { background: #ff0000; }

#noteScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 300; padding: 20px; }
#noteContent { background: #f4e4bc; color: #3a2a1a; padding: 35px; max-width: 450px; font-family: 'Courier New', serif; transform: rotate(-1deg); box-shadow: 0 10px 40px rgba(0,0,0,0.8); font-size: 1em; line-height: 1.8; }

#loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; color: #8b0000; }
#loading h2 { font-size: 2em; margin-bottom: 20px; letter-spacing: 5px; }
#loadingBar { width: 280px; height: 5px; background: #222; overflow: hidden; border-radius: 3px; }
#loadingFill { height: 100%; background: #8b0000; width: 0%; transition: width 0.3s; }
#loadingText { margin-top: 15px; color: #666; font-size: 0.9em; }

#pauseMenu { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2500; }
#pauseMenu h2 { color: #8b0000; font-size: 3em; margin-bottom: 30px; }

#pauseBtn { position: absolute; top: 15px; right: 210px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 1px solid #666; color: #fff; font-size: 1.2em; pointer-events: auto; touch-action: none; cursor: pointer; border-radius: 3px; }

#fullscreenBtn { position: absolute; top: 15px; right: 260px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 1px solid #666; color: #fff; font-size: 1.2em; pointer-events: auto; touch-action: none; cursor: pointer; border-radius: 3px; }

#scareFlash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 60; mix-blend-mode: overlay; }

#difficultyDisplay { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); color: #ff6666; font-size: 0.85em; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 3px; border: 1px solid #550000; }

#fpsCounter { position: absolute; bottom: 15px; right: 15px; color: #0f0; font-size: 11px; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 3px; pointer-events: none; z-index: 150; display: none; }
</style>
</head>
<body>

<div id="loading">
<h2>DARK HOUSE</h2>
<div id="loadingBar"><div id="loadingFill"></div></div>
<div id="loadingText">جاري تحميل المنزل...</div>
</div>

<div id="mainMenu">
<h1>DARK HOUSE</h1>
<div class="cinematic-badge">🎬 CINEMATIC EDITION</div>
<div class="subtitle">منزل الظلام - لا مفر</div>

<div class="graphicsSection">
<h3>🎨 جودة الرسوم</h3>
<div class="graphicsButtons">
<button class="gfxBtn" data-gfx="low" onclick="selectGraphics('low')">منخفضة</button>
<button class="gfxBtn selected" data-gfx="medium" onclick="selectGraphics('medium')">متوسطة</button>
<button class="gfxBtn" data-gfx="high" onclick="selectGraphics('high')">عالية</button>
<button class="gfxBtn" data-gfx="ultra" onclick="selectGraphics('ultra')">سينمائية</button>
</div>
</div>

<div class="difficultySection">
<h3>⚙ مستوى الصعوبة</h3>
<div class="difficultyButtons">
<button class="diffBtn" data-diff="easy" onclick="selectDifficulty('easy')">سهل</button>
<button class="diffBtn selected" data-diff="normal" onclick="selectDifficulty('normal')">متوسط</button>
<button class="diffBtn" data-diff="hard" onclick="selectDifficulty('hard')">صعب</button>
</div>
</div>

<button class="menuButton" onclick="startGame()">🎮 ابدأ اللعبة</button>
<button class="menuButton" onclick="toggleFullscreen()">🖥️ ملء الشاشة</button>
<button class="menuButton" onclick="showControls()">🎯 التحكم</button>
<button class="menuButton" onclick="showAbout()">📖 عن اللعبة</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="gameUI">
<div id="crosshair"></div>
<div id="interactionHint">اضغط E للتفاعل</div>
<div id="difficultyDisplay">المتوسط</div>

<div id="objective">
<div class="title">▸ المهمة</div>
<div id="objectiveText">ابحثي عن طريقة للهروب</div>
</div>

<button id="fullscreenBtn" onclick="toggleFullscreen()">⛶</button>
<button id="pauseBtn" onclick="pauseGame()">⏸</button>

<div class="barContainer" id="healthBar">
<div class="label">❤ الصحة</div>
<div class="bar"><div class="barFill" id="healthFill" style="width:100%"></div></div>
</div>
<div class="barContainer" id="staminaBar">
<div class="label">⚡ التحمل</div>
<div class="bar"><div class="barFill" id="staminaFill" style="width:100%"></div></div>
</div>
<div class="barContainer" id="batteryBar">
<div class="label">🔋 البطارية <span id="batteryStatus"></span></div>
<div class="bar"><div class="barFill" id="batteryFill" style="width:100%"></div></div>
</div>

<div id="inventory">
<div class="invSlot" id="slot0"></div>
<div class="invSlot" id="slot1"></div>
<div class="invSlot" id="slot2"></div>
<div class="invSlot" id="slot3"></div>
<div class="invSlot" id="slot4"></div>
<div class="invSlot" id="slot5"></div>
</div>

<div id="mobileControls">
<div id="joystick"><div id="joystickKnob"></div></div>
<div class="actionButton" id="btnInteract">تفاعل<br>E</div>
<div class="actionButton" id="btnFlashlight">مصباح<br>F</div>
<div class="actionButton" id="btnHide">اختباء<br>H</div>
<div class="actionButton" id="btnRun">جري<br>⇧</div>
</div>

<div id="damageOverlay"></div>
<div id="hideOverlay"></div>
<div id="hideVignette"></div>
<div id="heartbeat"></div>
<div id="dangerIndicator">
<div class="dangerEdge top"></div>
<div class="dangerEdge bottom"></div>
<div class="dangerEdge left"></div>
<div class="dangerEdge right"></div>
</div>
<div id="scareFlash"></div>
<div id="messageBox"></div>
<div id="fpsCounter">FPS: 0</div>
</div>

<div id="puzzleScreen"><div id="puzzleContent"></div></div>
<div id="noteScreen"><div id="noteContent"></div></div>

<div id="pauseMenu">
<h2>إيقاف مؤقت</h2>
<button class="menuButton" onclick="resumeGame()">استمرار</button>
<button class="menuButton" onclick="restartGame()">إعادة</button>
<button class="menuButton" onclick="quitToMenu()">القائمة</button>
</div>

<div id="gameOver">
<h1 id="gameOverTitle">انتهت اللعبة</h1>
<p id="gameOverText">لقد أمسك بك القاتل...</p>
<button class="menuButton" onclick="restartGame()">حاول مرة أخرى</button>
<button class="menuButton" onclick="quitToMenu()">القائمة الرئيسية</button>
</div>

<!-- Three.js r128 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<!-- Post Processing -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// ============================================================
// لعبة منزل الظلام - النسخة السينمائية الاحترافية
// Post-Processing: Bloom + Vignette + Film Grain + Color Grade
// PBR Materials + Normal Maps + Spotlight Cookie
// ============================================================

let scene, camera, renderer, composer;
let bloomPass, cinematicPass;
let clock = new THREE.Clock();
let gameState = 'menu';
let isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

// ============ إعدادات الرسوم ============
const GRAPHICS = {
    low: {
        name: 'منخفضة',
        pixelRatio: 1.0,
        shadows: false,
        shadowSize: 512,
        bloom: false,
        bloomStrength: 0,
        cinematic: false,
        normalMaps: false,
        physicalMaterials: false,
        particleCount: 200,
        bloodParticles: 20,
        flashlightCookie: false,
        antialias: false,
        color: '#666666'
    },
    medium: {
        name: 'متوسطة',
        pixelRatio: 1.3,
        shadows: true,
        shadowSize: 1024,
        bloom: true,
        bloomStrength: 0.3,
        cinematic: true,
        normalMaps: false,
        physicalMaterials: false,
        particleCount: 400,
        bloodParticles: 50,
        flashlightCookie: true,
        antialias: false,
        color: '#ffaa00'
    },
    high: {
        name: 'عالية',
        pixelRatio: 1.6,
        shadows: true,
        shadowSize: 1536,
        bloom: true,
        bloomStrength: 0.5,
        cinematic: true,
        normalMaps: true,
        physicalMaterials: true,
        particleCount: 600,
        bloodParticles: 80,
        flashlightCookie: true,
        antialias: true,
        color: '#00aaff'
    },
    ultra: {
        name: 'سينمائية',
        pixelRatio: Math.min(window.devicePixelRatio, 2),
        shadows: true,
        shadowSize: 2048,
        bloom: true,
        bloomStrength: 0.7,
        cinematic: true,
        normalMaps: true,
        physicalMaterials: true,
        particleCount: 800,
        bloodParticles: 100,
        flashlightCookie: true,
        antialias: true,
        color: '#ff00ff'
    }
};

let currentGraphics = isMobile ? 'medium' : 'high';
let gfxSettings = GRAPHICS[currentGraphics];

// ============ نظام الصعوبة ============
const DIFFICULTY = {
    easy: { name: 'سهل', killerSpeed: 1.8, killerChaseSpeed: 3.5, killerSight: 11, killerHearing: 8, batteryDrain: 1.2, batteryCharge: 5, damage: 20, awarenessGain: 0.7, color: '#00aa00' },
    normal: { name: 'متوسط', killerSpeed: 2.2, killerChaseSpeed: 4.2, killerSight: 14, killerHearing: 10, batteryDrain: 2, batteryCharge: 3, damage: 35, awarenessGain: 1.0, color: '#ffaa00' },
    hard: { name: 'صعب', killerSpeed: 2.8, killerChaseSpeed: 5.0, killerSight: 18, killerHearing: 13, batteryDrain: 3, batteryCharge: 1.5, damage: 50, awarenessGain: 1.4, color: '#ff0000' }
};

let currentDifficulty = 'normal';
let diffSettings = DIFFICULTY.normal;

window.selectDifficulty = function(diff) {
    currentDifficulty = diff;
    diffSettings = DIFFICULTY[diff];
    document.querySelectorAll('.diffBtn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`[data-diff="${diff}"]`).classList.add('selected');
    vibrate(30);
};

window.selectGraphics = function(gfx) {
    currentGraphics = gfx;
    gfxSettings = GRAPHICS[gfx];
    document.querySelectorAll('.gfxBtn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`[data-gfx="${gfx}"]`).classList.add('selected');
    vibrate(30);
};

function vibrate(pattern) {
    if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
    }
}

window.toggleFullscreen = function() {
    const elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen().catch(e => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        vibrate(50);
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
};

// ============ اللاعب ============
const player = {
    position: new THREE.Vector3(0, 1.7, 12),
    velocity: new THREE.Vector3(),
    rotation: { x: 0, y: 0 },
    height: 1.7,
    radius: 0.35,
    speed: 3.2,
    runSpeed: 5.8,
    isRunning: false,
    health: 100,
    maxHealth: 100,
    stamina: 100,
    maxStamina: 100,
    battery: 100,
    maxBattery: 100,
    flashlightOn: true,
    isHiding: false,
    hidingSpot: null,
    heartbeat: 0,
    fear: 0,
    inventory: [],
    maxInventory: 6,
    canInteract: false,
    interactTarget: null,
    footstepTimer: 0,
    breathTimer: 0,
    flashlight: null,
    headBob: 0,
    hideBreathTimer: 0,
    originalFov: 75,
    savedPosition: null,
    savedRotation: null,
    focusDistance: 10,
    targetFocusDistance: 10
};

// ============ القاتل ============
const killer = {
    mesh: null,
    position: new THREE.Vector3(12, 0, -12),
    velocity: new THREE.Vector3(),
    speed: 2.2,
    chaseSpeed: 4.2,
    state: 'patrol',
    patrolPoints: [],
    currentPatrolIndex: 0,
    lastKnownPlayerPos: null,
    searchTimer: 0,
    attackCooldown: 0,
    awareness: 0,

// ============ Custom Cinematic Shader ============
// يدمج: Vignette + Film Grain + Color Grade + Fake DOF + Chromatic Aberration
const CinematicShader = {
    uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        vignetteStrength: { value: 0.6 },
        vignetteFade: { value: 0.5 },
        grainStrength: { value: 0.12 },
        scanlineStrength: { value: 0.03 },
        colorGrade: { value: 1 },
        aberration: { value: 0.0015 },
        dofStrength: { value: 0.0 },
        focusPoint: { value: 0.5 },
        fear: { value: 0.0 },
        damage: { value: 0.0 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float vignetteStrength;
        uniform float vignetteFade;
        uniform float grainStrength;
        uniform float scanlineStrength;
        uniform float colorGrade;
        uniform float aberration;
        uniform float dofStrength;
        uniform float focusPoint;
        uniform float fear;
        uniform float damage;
        varying vec2 vUv;
        
        // Random function for grain
        float random(vec2 co) {
            return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }
        
        void main() {
            vec2 uv = vUv;
            
            // Chromatic Aberration (يزيد مع الخوف)
            float ab = aberration * (1.0 + fear * 2.0);
            vec2 dir = (uv - 0.5) * ab;
            float r = texture2D(tDiffuse, uv + dir).r;
            float g = texture2D(tDiffuse, uv).g;
            float b = texture2D(tDiffuse, uv - dir).b;
            vec3 color = vec3(r, g, b);
            
            // Fake DOF (blur على الحواف)
            if (dofStrength > 0.001) {
                float dist = distance(uv, vec2(0.5));
                float blur = smoothstep(focusPoint, focusPoint + 0.3, dist) * dofStrength;
                vec3 blurred = vec3(0.0);
                float total = 0.0;
                for (float x = -2.0; x <= 2.0; x += 1.0) {
                    for (float y = -2.0; y <= 2.0; y += 1.0) {
                        vec2 offset = vec2(x, y) * blur * 0.003;
                        blurred += texture2D(tDiffuse, uv + offset).rgb;
                        total += 1.0;
                    }
                }
                color = mix(color, blurred / total, blur * 2.0);
            }
            
            // Vignette (سينمائي)
            vec2 vigUv = uv * (1.0 - uv);
            float vig = vigUv.x * vigUv.y * 15.0;
            vig = pow(vig, vignetteFade);
            color *= mix(1.0, vig, vignetteStrength);
            
            // Film Grain (حبيبات الفيلم)
            float grain = random(uv * time) * grainStrength;
            color += vec3(grain) - grainStrength * 0.5;
            
            // Scanlines خفيفة (TV قديم)
            float scanline = sin(uv.y * 800.0) * 0.5 + 0.5;
            color -= scanline * scanlineStrength;
            
            // Color Grading (أزرق/أخضر مرعب)
            if (colorGrade > 0.0) {
                // تقليل الاحمر، زيادة الأزرق/الأخضر
                color.r *= 0.92;
                color.g *= 1.02;
                color.b *= 1.08;
                
                // Contrast زيادة
                color = (color - 0.5) * 1.15 + 0.5;
                
                // Shadows أكثر زرقة
                float luma = dot(color, vec3(0.299, 0.587, 0.114));
                vec3 shadowTint = vec3(0.05, 0.08, 0.15);
                color = mix(color, color + shadowTint * (1.0 - luma), 0.3 * colorGrade);
            }
            
            // تأثير الخوف (احمرار + اهتزاز لوني)
            if (fear > 0.0) {
                float pulse = sin(time * 8.0) * 0.5 + 0.5;
                color.r += fear * 0.15 * pulse;
                color.g -= fear * 0.05;
                color.b -= fear * 0.05;
            }
            
            // تأثير الضرر
            if (damage > 0.0) {
                color.r += damage * 0.4;
                color.g *= (1.0 - damage * 0.5);
                color.b *= (1.0 - damage * 0.5);
            }
            
            // Clamp
            color = clamp(color, 0.0, 1.0);
            
            gl_FragColor = vec4(color, 1.0);
        }
    `
};

// ============ Procedural Normal Maps ============
function createWoodNormalMap() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // Base normal (pointing up: 128, 128, 255)
    ctx.fillStyle = 'rgb(128, 128, 255)';
    ctx.fillRect(0, 0, size, size);
    
    // Lines of wood grain
    for (let i = 0; i < 60; i++) {
        const y = Math.random() * size;
        const intensity = Math.random() * 0.5 + 0.2;
        const r = Math.floor(128 + (Math.random() - 0.5) * 60 * intensity);
        const g = Math.floor(128 + (Math.random() - 0.5) * 100 * intensity);
        ctx.strokeStyle = `rgb(${r}, ${g}, 255)`;
        ctx.lineWidth = Math.random() * 2 + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x < size; x += 10) {
            ctx.lineTo(x, y + (Math.random() - 0.5) * 4);
        }
        ctx.stroke();
    }
    
    // Knots
    for (let i = 0; i < 3; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = Math.random() * 15 + 8;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgb(100, 100, 200)');
        grad.addColorStop(1, 'rgb(128, 128, 255)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    house.textures.push(texture);
    return texture;
}

// نمط ضوء الكشاف الحقيقي مع غبار وشوائب العدسة
function createFlashlightCookie() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // أسود في الخارج
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, size, size);
    
    // دائرة الضوء الرئيسية
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.95)');
    grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.7)');
    grad.addColorStop(0.85, 'rgba(255, 255, 255, 0.3)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
    ctx.fill();
    
    // شوائب العدسة (غبار)
    for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * size * 0.4;
        const x = size/2 + Math.cos(angle) * dist;
        const y = size/2 + Math.sin(angle) * dist;
        const r = Math.random() * 3 + 1;
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.4 + 0.1})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // خطوط خدش على العدسة
    for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = `rgba(0, 0, 0, ${Math.random() * 0.3 + 0.1})`;
        ctx.lineWidth = Math.random() * 1 + 0.3;
        ctx.beginPath();
        const x1 = Math.random() * size;
        const y1 = Math.random() * size;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + (Math.random() - 0.5) * 80, y1 + (Math.random() - 0.5) * 80);
        ctx.stroke();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    house.textures.push(texture);
    return texture;
}

// ============ Post-Processing Setup ============
function setupPostProcessing() {
    try {
        if (typeof THREE.EffectComposer === 'undefined') {
            console.warn('EffectComposer not loaded, using fallback');
            composer = null;
            return;
        }
        
        composer = new THREE.EffectComposer(renderer);
        
        // Render pass
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        // Bloom pass (التوهج)
        if (gfxSettings.bloom && typeof THREE.UnrealBloomPass !== 'undefined') {
            const bloomResolution = new THREE.Vector2(window.innerWidth, window.innerHeight);
            bloomPass = new THREE.UnrealBloomPass(bloomResolution, gfxSettings.bloomStrength, 0.5, 0.85);
            bloomPass.threshold = 0.7;
            bloomPass.strength = gfxSettings.bloomStrength;
            bloomPass.radius = 0.4;
            composer.addPass(bloomPass);
        }
        
        // Cinematic pass (Vignette + Grain + Color Grade + DOF + Chromatic Aberration)
        if (gfxSettings.cinematic && typeof THREE.ShaderPass !== 'undefined') {
            cinematicPass = new THREE.ShaderPass(CinematicShader);
            cinematicPass.renderToScreen = true;
            cinematicPass.uniforms.vignetteStrength.value = 0.65;
            cinematicPass.uniforms.vignetteFade.value = 0.45;
            cinematicPass.uniforms.grainStrength.value = 0.1;
            cinematicPass.uniforms.scanlineStrength.value = 0.02;
            cinematicPass.uniforms.colorGrade.value = 1.0;
            cinematicPass.uniforms.aberration.value = 0.0012;
            cinematicPass.uniforms.dofStrength.value = 0.0;
            composer.addPass(cinematicPass);
        } else {
            // Fallback: copy pass
            if (typeof THREE.ShaderPass !== 'undefined' && THREE.CopyShader) {
                const copyPass = new THREE.ShaderPass(THREE.CopyShader);
                copyPass.renderToScreen = true;
                composer.addPass(copyPass);
            }
        }
        
        console.log('🎬 Post-processing initialized');
    } catch (e) {
        console.warn('Post-processing setup failed:', e);
        composer = null;
    }
}

// ============ تنظيف الذاكرة ============
function cleanupMemory() {
    house.textures.forEach(tex => { if (tex && tex.dispose) tex.dispose(); });
    house.textures = [];
    house.geometries.forEach(geo => { if (geo && geo.dispose) geo.dispose(); });
    house.geometries = [];
    house.materials.forEach(mat => { if (mat && mat.dispose) mat.dispose(); });
    house.materials = [];
    
    if (scene) {
        scene.traverse(obj => {
            if (obj.geometry && obj.geometry.dispose) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(m => m.dispose && m.dispose());
                } else if (obj.material.dispose) {
                    obj.material.dispose();
                }
            }
        });
    }
    
    if (composer) {
        if (composer.renderTarget1) composer.renderTarget1.dispose();
        if (composer.renderTarget2) composer.renderTarget2.dispose();
    }
    
    if (audio.context && audio.context.state !== 'closed') {
        try { audio.context.close(); } catch (e) {}
    }
    audio.context = null;
    audio.initialized = false;
}

function createInteriorWalls(wallTex, wallNormal) {
    let wallMat;
    if (gfxSettings.physicalMaterials) {
        wallMat = new THREE.MeshPhysicalMaterial({
            map: wallTex.clone(),
            normalMap: wallNormal ? wallNormal.clone() : null,
            normalScale: new THREE.Vector2(1.2, 1.2),
            roughness: 0.95,
            metalness: 0.02,
            color: 0x5a4028
        });
    } else {
        wallMat = new THREE.MeshStandardMaterial({
            map: wallTex.clone(),
            normalMap: wallNormal ? wallNormal.clone() : null,
            normalScale: new THREE.Vector2(1.2, 1.2),
            roughness: 0.95,
            metalness: 0.02,
            color: 0x5a4028
        });
    }
    wallMat.map.repeat.set(2, 1);
    if (wallMat.normalMap) wallMat.normalMap.repeat.set(2, 1);
    house.materials.push(wallMat);
    
    const interiorWalls = [
        { pos: [0, 3, 0], size: [0.2, 6, 12], hasDoor: true, doorPos: 2 },
        { pos: [-7, 3, -7], size: [14, 6, 0.2], hasDoor: true, doorPos: 0 },
        { pos: [7, 3, 7], size: [14, 6, 0.2], hasDoor: true, doorPos: -2 },
        { pos: [-7, 3, 7], size: [0.2, 6, 14], hasDoor: true, doorPos: 3 },
        { pos: [7, 3, -7], size: [0.2, 6, 14], hasDoor: true, doorPos: -3 }
    ];
    
    interiorWalls.forEach(w => {
        const doorWidth = 1.4;
        const totalLength = w.size[0] > w.size[2] ? w.size[0] : w.size[2];
        const halfLen = totalLength / 2;
        const doorHalf = doorWidth / 2;
        
        const len1 = halfLen + w.doorPos - doorHalf;
        if (len1 > 0.1) {
            let geo, mesh;
            if (w.size[0] > w.size[2]) {
                geo = new THREE.BoxGeometry(len1, w.size[1], w.size[2]);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0] - halfLen + len1/2, w.pos[1], w.pos[2]);
            } else {
                geo = new THREE.BoxGeometry(w.size[0], w.size[1], len1);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0], w.pos[1], w.pos[2] - halfLen + len1/2);
            }
            house.geometries.push(geo);
            mesh.castShadow = gfxSettings.shadows;
            mesh.receiveShadow = true;
            scene.add(mesh);
            house.collisions.push(mesh);
        }
        
        const len2 = halfLen - w.doorPos - doorHalf;
        if (len2 > 0.1) {
            let geo, mesh;
            if (w.size[0] > w.size[2]) {
                geo = new THREE.BoxGeometry(len2, w.size[1], w.size[2]);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0] + halfLen - len2/2, w.pos[1], w.pos[2]);
            } else {
                geo = new THREE.BoxGeometry(w.size[0], w.size[1], len2);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0], w.pos[1], w.pos[2] + halfLen - len2/2);
            }
            house.geometries.push(geo);
            mesh.castShadow = gfxSettings.shadows;
            mesh.receiveShadow = true;
            scene.add(mesh);
            house.collisions.push(mesh);
        }
    });
}

function createCreepyPainting(x, y, z, rotY) {
    const paintingGroup = new THREE.Group();
    
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.8 });
    house.materials.push(frameMat);
    const frameGeo = new THREE.BoxGeometry(1.2, 1.5, 0.08);
    house.geometries.push(frameGeo);
    const frame = new THREE.Mesh(frameGeo, frameMat);
    paintingGroup.add(frame);
    
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 320;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#1a0a05';
    ctx.fillRect(0, 0, 256, 320);
    
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.ellipse(128, 160, 80, 110, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(100, 140, 15, 0, Math.PI * 2);
    ctx.arc(156, 140, 15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.arc(100, 140, 4, 0, Math.PI * 2);
    ctx.arc(156, 140, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(128, 210, 25, 35, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#8b0000';
    ctx.fillRect(95, 155, 4, 40);
    ctx.fillRect(157, 155, 4, 40);
    
    const tex = new THREE.CanvasTexture(canvas);
    house.textures.push(tex);
    const canvasMat = new THREE.MeshBasicMaterial({ map: tex });
    house.materials.push(canvasMat);
    const canvasGeo = new THREE.PlaneGeometry(1.05, 1.35);
    house.geometries.push(canvasGeo);
    const canvasMesh = new THREE.Mesh(canvasGeo, canvasMat);
    canvasMesh.position.z = 0.045;
    paintingGroup.add(canvasMesh);
    
    paintingGroup.position.set(x, y, z);
    paintingGroup.rotation.y = rotY;
    scene.add(paintingGroup);
}

function createSpiderWeb(x, y, z) {
    const webMat = new THREE.MeshBasicMaterial({ 
        color: 0xcccccc, transparent: true, opacity: 0.3, side: THREE.DoubleSide
    });
    house.materials.push(webMat);
    
    const webGroup = new THREE.Group();
    const segments = 8;
    const radius = 0.8;
    
    for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const geometry = new THREE.BufferGeometry();
        const vertices = new Float32Array([
            0, 0, 0,
            Math.cos(angle) * radius, Math.sin(angle) * radius, 0
        ]);
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        house.geometries.push(geometry);
        const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.4 }));
        webGroup.add(line);
    }
    
    for (let r = 0.2; r <= radius; r += 0.2) {
        const circleGeo = new THREE.RingGeometry(r - 0.01, r, 32);
        house.geometries.push(circleGeo);
        const circle = new THREE.Mesh(circleGeo, webMat);
        webGroup.add(circle);
    }
    
    webGroup.position.set(x, y, z);
    webGroup.rotation.x = Math.PI / 2;
    scene.add(webGroup);
}
