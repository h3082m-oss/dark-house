<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>منزل الظلام - Dark House</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; }
html, body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; width: 100%; height: 100%; position: fixed; }
#gameCanvas { width: 100vw; height: 100vh; display: block; cursor: none; touch-action: none; }

#mainMenu { position: fixed; inset: 0; background: radial-gradient(circle, #1a0000 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
#mainMenu h1 { font-size: clamp(2em, 8vw, 4em); color: #8b0000; text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000; margin-bottom: 20px; letter-spacing: 5px; animation: flicker 3s infinite; }
#mainMenu .subtitle { color: #666; font-size: 1.2em; margin-bottom: 50px; font-style: italic; }
.menuButton { background: linear-gradient(135deg, #2a0000, #000); color: #ff3333; border: 2px solid #8b0000; padding: 15px 50px; font-size: 1.3em; margin: 10px; cursor: pointer; font-family: inherit; letter-spacing: 3px; transition: all 0.3s; }
.menuButton:hover, .menuButton:active { background: #8b0000; color: #fff; box-shadow: 0 0 30px #ff0000; }
@keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } 52% { opacity: 0.4; } 54% { opacity: 1; } }

#gameUI { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.4); }
#crosshair::before { width: 2px; height: 6px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
#crosshair::after { width: 6px; height: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

#interactionHint { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 1.1em; text-shadow: 0 0 10px #000; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 5px; border: 1px solid rgba(255,204,0,0.3); white-space: nowrap; }
#interactionHint.show { opacity: 1; }

#objective { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.95em; background: rgba(0,0,0,0.75); padding: 10px 18px; border-left: 3px solid #8b0000; max-width: 300px; }
#objective .title { color: #ff3333; font-size: 0.75em; letter-spacing: 2px; margin-bottom: 4px; }

#inventory { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.invSlot { width: 55px; height: 55px; background: rgba(0,0,0,0.75); border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 1.8em; color: #fff; border-radius: 4px; }
.invSlot.hasItem { border-color: #ffcc00; box-shadow: 0 0 12px rgba(255,204,0,0.6); }

.barContainer { position: absolute; right: 15px; width: 180px; }
.barContainer .label { color: #fff; font-size: 0.75em; margin-bottom: 3px; text-shadow: 0 0 5px #000; }
.bar { width: 100%; height: 8px; background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 2px; overflow: hidden; }
.barFill { height: 100%; transition: width 0.3s; }
#healthBar { top: 15px; }
#healthBar .barFill { background: linear-gradient(90deg, #8b0000, #ff0000); }
#staminaBar { top: 55px; }
#staminaBar .barFill { background: linear-gradient(90deg, #006600, #00ff00); }
#batteryBar { top: 95px; }
#batteryBar .barFill { background: linear-gradient(90deg, #ccaa00, #ffff00); }
#batteryBar .charging .barFill { background: linear-gradient(90deg, #00aa00, #00ff00); animation: chargePulse 1s infinite; }
@keyframes chargePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

#mobileControls { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 110; }
#joystick { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; pointer-events: auto; touch-action: none; }
#joystickKnob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; transition: none; }

.actionButton { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 0.75em; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; font-weight: bold; text-align: center; }
#btnInteract { bottom: 130px; right: 30px; background: rgba(255,204,0,0.3); border-color: #ffcc00; }
#btnFlashlight { bottom: 220px; right: 30px; background: rgba(255,255,0,0.3); border-color: #ffff00; }
#btnHide { bottom: 130px; right: 115px; background: rgba(100,100,255,0.3); border-color: #6666ff; }
#btnRun { bottom: 220px; right: 115px; background: rgba(255,100,100,0.3); border-color: #ff6666; }
.actionButton:active { transform: scale(0.9); }

#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%); z-index: 50; }
#damageOverlay { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 30%, rgba(139,0,0,0.85) 100%); opacity: 0; transition: opacity 0.3s; z-index: 51; }
#hideOverlay { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity 0.5s; z-index: 52; }
#heartbeat { position: absolute; inset: 0; pointer-events: none; border: 0 solid rgba(139,0,0,0); z-index: 53; transition: border 0.1s; }
#hideVignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 5%, rgba(0,0,0,0.95) 25%); opacity: 0; transition: opacity 0.5s; z-index: 54; }

#messageBox { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 1.3em; text-align: center; text-shadow: 0 0 10px #000; opacity: 0; transition: opacity 0.5s; z-index: 200; background: rgba(0,0,0,0.85); padding: 18px 35px; border: 1px solid #8b0000; max-width: 80%; border-radius: 4px; }
#messageBox.show { opacity: 1; }

#gameOver { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
#gameOver h1 { color: #8b0000; font-size: clamp(2.5em, 8vw, 5em); text-shadow: 0 0 30px #ff0000; margin-bottom: 30px; }
#gameOver p { color: #aaa; font-size: 1.1em; margin-bottom: 30px; max-width: 600px; text-align: center; padding: 0 20px; }

#puzzleScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 300; padding: 20px; }
#puzzleContent { background: #1a1a1a; border: 2px solid #8b0000; padding: 25px; max-width: 500px; width: 100%; color: #fff; border-radius: 5px; }
#puzzleContent h2 { color: #ff3333; margin-bottom: 15px; }
.puzzleInput { background: #000; border: 1px solid #444; color: #fff; padding: 10px; font-size: 1.2em; width: 100%; margin: 10px 0; font-family: inherit; text-align: center; letter-spacing: 5px; }
.puzzleButton { background: #8b0000; color: #fff; border: none; padding: 10px 25px; font-size: 1em; cursor: pointer; margin: 5px; font-family: inherit; border-radius: 3px; }
.puzzleButton:hover, .puzzleButton:active { background: #ff0000; }

#noteScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 300; padding: 20px; }
#noteContent { background: #f4e4bc; color: #3a2a1a; padding: 35px; max-width: 450px; font-family: 'Courier New', serif; transform: rotate(-1deg); box-shadow: 0 10px 40px rgba(0,0,0,0.8); font-size: 1em; line-height: 1.8; }

#loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; color: #8b0000; }
#loading h2 { font-size: 2em; margin-bottom: 20px; letter-spacing: 5px; }
#loadingBar { width: 280px; height: 5px; background: #222; overflow: hidden; border-radius: 3px; }
#loadingFill { height: 100%; background: #8b0000; width: 0%; transition: width 0.3s; }
#loadingText { margin-top: 15px; color: #666; font-size: 0.9em; }

#pauseMenu { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2500; }
#pauseMenu h2 { color: #8b0000; font-size: 3em; margin-bottom: 30px; }

#pauseBtn { position: absolute; top: 15px; right: 210px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 1px solid #666; color: #fff; font-size: 1.2em; pointer-events: auto; touch-action: none; cursor: pointer; border-radius: 3px; }

#scareFlash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 60; mix-blend-mode: overlay; }
</style>
</head>
<body>

<div id="loading">
<h2>DARK HOUSE</h2>
<div id="loadingBar"><div id="loadingFill"></div></div>
<div id="loadingText">جاري تحميل المنزل...</div>
</div>

<div id="mainMenu">
<h1>DARK HOUSE</h1>
<div class="subtitle">منزل الظلام - لا مفر</div>
<button class="menuButton" onclick="startGame()">ابدأ اللعبة</button>
<button class="menuButton" onclick="showControls()">التحكم</button>
<button class="menuButton" onclick="showAbout()">عن اللعبة</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="gameUI">
<div id="crosshair"></div>
<div id="interactionHint">اضغط E للتفاعل</div>

<div id="objective">
<div class="title">▸ المهمة</div>
<div id="objectiveText">ابحثي عن طريقة للهروب</div>
</div>

<button id="pauseBtn" onclick="pauseGame()">⏸</button>

<div class="barContainer" id="healthBar">
<div class="label">❤ الصحة</div>
<div class="bar"><div class="barFill" id="healthFill" style="width:100%"></div></div>
</div>
<div class="barContainer" id="staminaBar">
<div class="label">⚡ التحمل</div>
<div class="bar"><div class="barFill" id="staminaFill" style="width:100%"></div></div>
</div>
<div class="barContainer" id="batteryBar">
<div class="label">🔋 البطارية <span id="batteryStatus"></span></div>
<div class="bar"><div class="barFill" id="batteryFill" style="width:100%"></div></div>
</div>

<div id="inventory">
<div class="invSlot" id="slot0"></div>
<div class="invSlot" id="slot1"></div>
<div class="invSlot" id="slot2"></div>
<div class="invSlot" id="slot3"></div>
<div class="invSlot" id="slot4"></div>
<div class="invSlot" id="slot5"></div>
</div>

<div id="mobileControls">
<div id="joystick"><div id="joystickKnob"></div></div>
<div class="actionButton" id="btnInteract">تفاعل<br>E</div>
<div class="actionButton" id="btnFlashlight">مصباح<br>F</div>
<div class="actionButton" id="btnHide">اختباء<br>H</div>
<div class="actionButton" id="btnRun">جري<br>⇧</div>
</div>

<div id="vignette"></div>
<div id="damageOverlay"></div>
<div id="hideOverlay"></div>
<div id="hideVignette"></div>
<div id="heartbeat"></div>
<div id="scareFlash"></div>
<div id="messageBox"></div>
</div>

<div id="puzzleScreen"><div id="puzzleContent"></div></div>
<div id="noteScreen"><div id="noteContent"></div></div>

<div id="pauseMenu">
<h2>إيقاف مؤقت</h2>
<button class="menuButton" onclick="resumeGame()">استمرار</button>
<button class="menuButton" onclick="restartGame()">إعادة</button>
<button class="menuButton" onclick="quitToMenu()">القائمة</button>
</div>

<div id="gameOver">
<h1 id="gameOverTitle">انتهت اللعبة</h1>
<p id="gameOverText">لقد أمسك بك القاتل...</p>
<button class="menuButton" onclick="restartGame()">حاول مرة أخرى</button>
<button class="menuButton" onclick="quitToMenu()">القائمة الرئيسية</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// لعبة منزل الظلام - النسخة المرعبة المحسنة
// ============================================================

let scene, camera, renderer;
let clock = new THREE.Clock();
let gameState = 'menu';
let isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

// ============ اللاعب ============
const player = {
    position: new THREE.Vector3(0, 1.7, 12),
    velocity: new THREE.Vector3(),
    rotation: { x: 0, y: 0 },
    height: 1.7,
    radius: 0.35,
    speed: 3.2,
    runSpeed: 5.8,
    isRunning: false,
    health: 100,
    maxHealth: 100,
    stamina: 100,
    maxStamina: 100,
    battery: 100,
    maxBattery: 100,
    flashlightOn: true,
    isHiding: false,
    hidingSpot: null,
    heartbeat: 0,
    fear: 0,
    inventory: [],
    maxInventory: 6,
    canInteract: false,
    interactTarget: null,
    footstepTimer: 0,
    breathTimer: 0,
    flashlight: null,
    headBob: 0,
    hideBreathTimer: 0,
    originalFov: 75
};

// ============ القاتل ============
const killer = {
    mesh: null,
    position: new THREE.Vector3(12, 0, -12),
    velocity: new THREE.Vector3(),
    speed: 2.2,
    chaseSpeed: 4.2,
    state: 'patrol',
    patrolPoints: [],
    currentPatrolIndex: 0,
    lastKnownPlayerPos: null,
    searchTimer: 0,
    attackCooldown: 0,
    awareness: 0,
    sightRange: 14,
    hearingRange: 10,
    fieldOfView: Math.PI * 0.55,
    animationTime: 0,
    soundLevel: 0,
    light: null
};

// ============ المنزل ============
const house = {
    rooms: [],
    doors: [],
    items: [],
    hidingSpots: [],
    puzzles: [],
    notes: [],
    lights: [],
    particles: [],
    collisions: [],
    emergencyLight: null,
    scareEvents: [],
    whispers: []
};

// ============ الإدخال ============
const input = {
    keys: {},
    mouse: { dx: 0, dy: 0, locked: false },
    joystick: { active: false, x: 0, y: 0, touchId: null },
    look: { touchId: null, lastX: 0, lastY: 0 }
};

// ============ الصوت ============
const audio = {
    context: null,
    sounds: {},
    masterVolume: 0.6,
    initialized: false
};

// ============ Procedural Textures ============
function createWoodTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(0, 0, 512, 512);
    
    for (let i = 0; i < 80; i++) {
        const y = Math.random() * 512;
        const alpha = Math.random() * 0.3 + 0.1;
        ctx.strokeStyle = `rgba(${40 + Math.random() * 30}, ${25 + Math.random() * 20}, ${10 + Math.random() * 15}, ${alpha})`;
        ctx.lineWidth = Math.random() * 2 + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x < 512; x += 20) {
            ctx.lineTo(x, y + (Math.random() - 0.5) * 3);
        }
        ctx.stroke();
    }
    
    for (let i = 0; i < 5; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 15 + 8;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(30, 15, 5, 0.8)');
        grad.addColorStop(1, 'rgba(30, 15, 5, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    for (let i = 0; i < 300; i++) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.25})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 3, Math.random() * 3);
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    return texture;
}

function createWallTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(0, 0, 512, 512);
    
    for (let i = 0; i < 40; i++) {
        ctx.strokeStyle = `rgba(15, 8, 3, ${Math.random() * 0.5 + 0.2})`;
        ctx.lineWidth = Math.random() * 1.5 + 0.3;
        ctx.beginPath();
        let x = Math.random() * 512;
        let y = Math.random() * 512;
        ctx.moveTo(x, y);
        for (let j = 0; j < 10; j++) {
            x += (Math.random() - 0.5) * 30;
            y += Math.random() * 20;
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    for (let i = 0; i < 50; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 25 + 8;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(${Math.random() * 30}, ${Math.random() * 15}, ${Math.random() * 10}, ${Math.random() * 0.5})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    for (let i = 0; i < 20; i++) {
        ctx.fillStyle = `rgba(60, 40, 25, ${Math.random() * 0.5 + 0.2})`;
        ctx.beginPath();
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const w = Math.random() * 30 + 10;
        const h = Math.random() * 20 + 5;
        ctx.ellipse(x, y, w, h, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // عفن
    for (let i = 0; i < 15; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 15 + 5;
        ctx.fillStyle = `rgba(20, 30, 15, ${Math.random() * 0.4 + 0.2})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    return texture;
}

function createCeilingTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#1a1008';
    ctx.fillRect(0, 0, 256, 256);
    
    for (let i = 0; i < 25; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = Math.random() * 30 + 10;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(10, 5, 2, ${Math.random() * 0.6})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    for (let i = 0; i < 20; i++) {
        ctx.strokeStyle = `rgba(5, 2, 1, ${Math.random() * 0.5 + 0.2})`;
        ctx.lineWidth = Math.random() + 0.3;
        ctx.beginPath();
        let x = Math.random() * 256;
        let y = Math.random() * 256;
        ctx.moveTo(x, y);
        for (let j = 0; j < 6; j++) {
            x += (Math.random() - 0.5) * 20;
            y += (Math.random() - 0.5) * 20;
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    return texture;
}

function createFabricTexture(color) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 128, 128);
    
    for (let i = 0; i < 400; i++) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.2})`;
        ctx.fillRect(Math.random() * 128, Math.random() * 128, 1, 1);
    }
    for (let i = 0; i < 200; i++) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.08})`;
        ctx.fillRect(Math.random() * 128, Math.random() * 128, 1, 1);
    }
    
    for (let i = 0; i < 10; i++) {
        const x = Math.random() * 128;
        const y = Math.random() * 128;
        const r = Math.random() * 12 + 3;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(30, 15, 5, 0.4)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    return new THREE.CanvasTexture(canvas);
}

function createBloodTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.clearRect(0, 0, 256, 256);
    
    // بقعة دم كبيرة
    ctx.fillStyle = 'rgba(100, 0, 0, 0.9)';
    ctx.beginPath();
    ctx.arc(128, 128, 60, 0, Math.PI * 2);
    ctx.fill();
    
    // رذاذ
    for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 100 + 30;
        const x = 128 + Math.cos(angle) * dist;
        const y = 128 + Math.sin(angle) * dist;
        const r = Math.random() * 6 + 2;
        ctx.fillStyle = `rgba(${80 + Math.random() * 40}, 0, 0, ${Math.random() * 0.7 + 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // تقطير
    for (let i = 0; i < 8; i++) {
        const x = 128 + (Math.random() - 0.5) * 80;
        ctx.strokeStyle = `rgba(90, 0, 0, ${Math.random() * 0.7 + 0.3})`;
        ctx.lineWidth = Math.random() * 3 + 1;
        ctx.beginPath();
        ctx.moveTo(x, 128);
        ctx.lineTo(x + (Math.random() - 0.5) * 10, 128 + Math.random() * 80 + 30);
        ctx.stroke();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.premultiplyAlpha = true;
    return texture;
}

function createWritingTexture(text) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    
    ctx.clearRect(0, 0, 512, 128);
    
    // خلفية دموية خفيفة
    for (let i = 0; i < 20; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 128;
        const r = Math.random() * 15 + 5;
        ctx.fillStyle = `rgba(80, 0, 0, ${Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // النص
    ctx.fillStyle = '#8b0000';
    ctx.font = 'bold 48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 64);
    
    // تأثير دموي على النص
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#5a0000';
    ctx.fillText(text, 258, 66);
    ctx.globalAlpha = 1;
    
    return new THREE.CanvasTexture(canvas);
}

function buildHouse() {

    ceilTex.repeat.set(4, 4);

    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    
    // الجدران الخارجية

        map: wallTex,
        roughness: 0.95,
        metalness: 0.02,
        color: 0x5a4028
    });
    
    const walls = [
        { pos: [0, 3, -15], size: [30, 6, 0.3] },
        { pos: [0, 3, 15], size: [30, 6, 0.3] },

    ];
    
    walls.forEach(w => {

        mesh.position.set(w.pos[0], w.pos[1], w.pos[2]);

        mesh.receiveShadow = true;
        scene.add(mesh);
        house.collisions.push(mesh);

    createInteriorWalls(wallTex);

}

function createInteriorWalls(wallTex) {
    const wallMat = new THREE.MeshStandardMaterial({
        map: wallTex.clone(),
        roughness: 0.95,
        metalness: 0.02,
        color: 0x5a4028
    });
    wallMat.map.repeat.set(2, 1);
    
    const interiorWalls = [
        { pos: [0, 3, 0], size: [0.2, 6, 12], hasDoor: true, doorPos: 2 },
        { pos: [-7, 3, -7], size: [14, 6, 0.2], hasDoor: true, doorPos: 0 },
        { pos: [7, 3, 7], size: [14, 6, 0.2], hasDoor: true, doorPos: -2 },
        { pos: [-7, 3, 7], size: [0.2, 6, 14], hasDoor: true, doorPos: 3 },
        { pos: [7, 3, -7], size: [0.2, 6, 14], hasDoor: true, doorPos: -3 }
    ];
    
    interiorWalls.forEach(w => {
        const doorWidth = 1.4;
        const totalLength = w.size[0] > w.size[2] ? w.size[0] : w.size[2];
        const halfLen = totalLength / 2;
        const doorHalf = doorWidth / 2;
        
        const len1 = halfLen + w.doorPos - doorHalf;
        if (len1 > 0.1) {
            let geo, mesh;
            if (w.size[0] > w.size[2]) {
                geo = new THREE.BoxGeometry(len1, w.size[1], w.size[2]);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0] - halfLen + len1/2, w.pos[1], w.pos[2]);
            } else {
                geo = new THREE.BoxGeometry(w.size[0], w.size[1], len1);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0], w.pos[1], w.pos[2] - halfLen + len1/2);
            }
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            house.collisions.push(mesh);
        }
        
        const len2 = halfLen - w.doorPos - doorHalf;
        if (len2 > 0.1) {
            let geo, mesh;
            if (w.size[0] > w.size[2]) {
                geo = new THREE.BoxGeometry(len2, w.size[1], w.size[2]);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0] + halfLen - len2/2, w.pos[1], w.pos[2]);
            } else {
                geo = new THREE.BoxGeometry(w.size[0], w.size[1], len2);
                mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(w.pos[0], w.pos[1], w.pos[2] + halfLen - len2/2);
            }
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            house.collisions.push(mesh);
        }
    });
}

function createCreepyPainting(x, y, z, rotY) {
    const paintingGroup = new THREE.Group();
    
    // الإطار
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.8 });
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.08), frameMat);
    paintingGroup.add(frame);
    
    // اللوحة (وجه مخيف)
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 320;
    const ctx = canvas.getContext('2d');
    
    // خلفية داكنة
    ctx.fillStyle = '#1a0a05';
    ctx.fillRect(0, 0, 256, 320);
    
    // وجه شبحي
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.ellipse(128, 160, 80, 110, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // عيون سوداء
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(100, 140, 15, 0, Math.PI * 2);
    ctx.arc(156, 140, 15, 0, Math.PI * 2);
    ctx.fill();
    
    // نقاط حمراء في العيون
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.arc(100, 140, 4, 0, Math.PI * 2);
    ctx.arc(156, 140, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // فم مفتوح
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(128, 210, 25, 35, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // دموع دم
    ctx.fillStyle = '#8b0000';
    ctx.fillRect(95, 155, 4, 40);
    ctx.fillRect(157, 155, 4, 40);
    
    const tex = new THREE.CanvasTexture(canvas);
    const canvasMat = new THREE.MeshBasicMaterial({ map: tex });
    const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.35), canvasMat);
    canvasMesh.position.z = 0.045;
    paintingGroup.add(canvasMesh);
    
    paintingGroup.position.set(x, y, z);
    paintingGroup.rotation.y = rotY;
    scene.add(paintingGroup);
}

function createSpiderWeb(x, y, z) {
    const webMat = new THREE.MeshBasicMaterial({ 
        color: 0xcccccc, 
        transparent: true, 
        opacity: 0.3,
        side: THREE.DoubleSide
    });
    
    // شبكة من الخطوط
    const webGroup = new THREE.Group();
    const segments = 8;
    const radius = 0.8;
    
    for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const geometry = new THREE.BufferGeometry();
        const vertices = new Float32Array([
            0, 0, 0,
            Math.cos(angle) * radius, Math.sin(angle) * radius, 0
        ]);
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.4 }));
        webGroup.add(line);
    }
    
    // دوائر
    for (let r = 0.2; r <= radius; r += 0.2) {
        const circleGeo = new THREE.RingGeometry(r - 0.01, r, 32);

function createPuzzleObjects() {
    const paintingGroup = new THREE.Group();
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.7 });
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.1), frameMat);
    paintingGroup.add(frame);
    
    const canvasMat = new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 1 });
    const canvas = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.8), canvasMat);
    canvas.position.z = 0.06;
    paintingGroup.add(canvas);
    
    const symbols = ['1', '3', '5', '7'];
    symbols.forEach((s, i) => {
        const symCanvas = document.createElement('canvas');
        symCanvas.width = 64;
        symCanvas.height = 64;
        const ctx = symCanvas.getContext('2d');
        ctx.fillStyle = '#8b0000';
        ctx.font = 'bold 48px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s, 32, 32);
        
        const tex = new THREE.CanvasTexture(symCanvas);
        const symMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const symMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), symMat);
        symMesh.position.set(-0.45 + i * 0.3, 0, 0.07);
        paintingGroup.add(symMesh);
    });
    
    paintingGroup.position.set(-14.5, 2, 5);
    paintingGroup.rotation.y = Math.PI / 2;
    scene.add(paintingGroup);
    
    const photoFrame = new THREE.Group();
    const pFrame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.1), frameMat);
    photoFrame.add(pFrame);
    
    for (let i = 0; i < 4; i++) {
        const photoCanvas = document.createElement('canvas');
        photoCanvas.width = 128;
        photoCanvas.height = 128;
        const ctx = photoCanvas.getContext('2d');
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#8b0000';
        ctx.font = 'bold 80px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((i + 1).toString(), 64, 64);
        
        const tex = new THREE.CanvasTexture(photoCanvas);
        const photoMat = new THREE.MeshBasicMaterial({ map: tex });
        const photo = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.25), photoMat);
        photo.position.set(-0.45 + i * 0.3, 0, 0.06);
        photoFrame.add(photo);
    }
    
    photoFrame.position.set(14.5, 2, -5);
    photoFrame.rotation.y = -Math.PI / 2;
    scene.add(photoFrame);
}

// ============ الصوت ============
function initAudio() {
    try {
        audio.context = new (window.AudioContext || window.webkitAudioContext)();
        audio.initialized = true;
        createProceduralSounds();
    } catch (e) {
        console.warn('Audio not supported');
    }
}

function createProceduralSounds() {
    audio.footstep = createNoiseBuffer(0.1, 200, 800);
    audio.breath = createNoiseBuffer(0.5, 100, 400);
    audio.heartbeat = createHeartbeatBuffer();
    audio.scream = createScreamBuffer();
    audio.door = createNoiseBuffer(0.3, 100, 600);
    audio.pickup = createPickupBuffer();
    audio.ambience = createAmbienceBuffer();
    audio.whisper = createWhisperBuffer();
    audio.creak = createCreakBuffer();
}

function createNoiseBuffer(duration, lowFreq, highFreq) {
    if (!audio.context) return null;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = lowFreq + Math.random() * (highFreq - lowFreq);
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.3;
    }
    return buffer;
}

function createHeartbeatBuffer() {
    if (!audio.context) return null;
    const duration = 0.3;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        data[i] = Math.sin(2 * Math.PI * 60 * t) * Math.exp(-t * 10) * 0.5;
    }
    return buffer;
}

function createScreamBuffer() {
    if (!audio.context) return null;
    const duration = 1.5;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 400 + Math.sin(t * 10) * 200;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.6;
    }
    return buffer;
}

function createPickupBuffer() {
    if (!audio.context) return null;
    const duration = 0.3;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 800 - t * 1000;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.3;
    }
    return buffer;
}

function createAmbienceBuffer() {
    if (!audio.context) return null;
    const duration = 4;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        data[i] = (Math.random() - 0.5) * 0.08 * Math.sin(t * 0.5);
    }
    return buffer;
}

function createWhisperBuffer() {
    if (!audio.context) return null;
    const duration = 1.5;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const noise = (Math.random() - 0.5) * 0.3;
        const mod = Math.sin(t * 8) * 0.5 + 0.5;
        data[i] = noise * mod * (1 - t / duration);
    }
    return buffer;
}

function createCreakBuffer() {
    if (!audio.context) return null;
    const duration = 0.8;
    const length = audio.context.sampleRate * duration;
    const buffer = audio.context.createBuffer(1, length, audio.context.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < length; i++) {
        const t = i / audio.context.sampleRate;
        const freq = 100 + Math.sin(t * 5) * 50 + Math.random() * 100;
        data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration) * 0.4;
    }
    return buffer;
}

function playSound(buffer, volume = 1, loop = false) {
    if (!audio.context || !buffer) return;
    if (audio.context.state === 'suspended') audio.context.resume();
    
    const source = audio.context.createBufferSource();
    source.buffer = buffer;
    source.loop = loop;
    
    const gain = audio.context.createGain();
    gain.gain.value = volume * audio.masterVolume;
    
    source.connect(gain);
    gain.connect(audio.context.destination);
    source.start();
    
    return { source, gain };
}

// ============ الأحداث ============
function setupEvents() {
    window.addEventListener('keydown', e => {
        input.keys[e.code] = true;
        
        if (e.code === 'Escape') {
            if (gameState === 'playing') pauseGame();
            else if (gameState === 'paused') resumeGame();
        }
        if (e.code === 'KeyE' && gameState === 'playing') interact();
        if (e.code === 'KeyF' && gameState === 'playing') toggleFlashlight();
        if (e.code === 'KeyH' && gameState === 'playing') tryHide();
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.isRunning = true;
    });
    
    window.addEventListener('keyup', e => {
        input.keys[e.code] = false;
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.isRunning = false;
    });
    
    const canvas = document.getElementById('gameCanvas');
    canvas.addEventListener('click', () => {
        if (gameState === 'playing' && !isMobile) {
            canvas.requestPointerLock();
        }
        if (audio.context && audio.context.state === 'suspended') {
            audio.context.resume();
        }
    });
    
    document.addEventListener('pointerlockchange', () => {
        input.mouse.locked = document.pointerLockElement === canvas;
    });
    
    document.addEventListener('mousemove', e => {
        if (input.mouse.locked && gameState === 'playing') {
            input.mouse.dx = e.movementX;
            input.mouse.dy = e.movementY;
            updatePlayerRotation();
        }
    });
    
    if (isMobile) {
        setupMobileControls();
    }
    
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 100));
}

function setupMobileControls() {
    document.getElementById('mobileControls').style.display = 'block';
    
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    let joystickCenter = { x: 0, y: 0 };
    const maxDistance = 50;
    
    joystick.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        const touch = e.changedTouches[0];
        input.joystick.touchId = touch.identifier;
        const rect = joystick.getBoundingClientRect();
        joystickCenter.x = rect.left + rect.width / 2;
        joystickCenter.y = rect.top + rect.height / 2;
        updateJoystick(touch.clientX, touch.clientY);
    }, { passive: false });
    
    joystick.addEventListener('touchmove', e => {
        e.preventDefault();
        e.stopPropagation();
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.joystick.touchId) {
                updateJoystick(touch.clientX, touch.clientY);
            }
        }
    }, { passive: false });
    
    const endJoystick = (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.joystick.touchId) {
                input.joystick.touchId = null;
                input.joystick.active = false;
                input.joystick.x = 0;
                input.joystick.y = 0;
                knob.style.transform = 'translate(-50%, -50%)';
            }
        }
    };
    
    joystick.addEventListener('touchend', endJoystick, { passive: false });
    joystick.addEventListener('touchcancel', endJoystick, { passive: false });
    
    function updateJoystick(clientX, clientY) {
        const dx = clientX - joystickCenter.x;
        const dy = clientY - joystickCenter.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const clampedDist = Math.min(dist, maxDistance);
        const angle = Math.atan2(dy, dx);
        
        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;
        
        knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        
        input.joystick.x = knobX / maxDistance;
        input.joystick.y = knobY / maxDistance;
        input.joystick.active = true;
    }
    
    document.addEventListener('touchstart', e => {
        for (let touch of e.changedTouches) {
            const target = touch.target;
            if (target.closest('#joystick') || target.closest('.actionButton') || target.closest('#pauseBtn')) {
                continue;
            }
            
            if (touch.clientX > window.innerWidth * 0.3 && input.look.touchId === null) {
                input.look.touchId = touch.identifier;
                input.look.lastX = touch.clientX;
                input.look.lastY = touch.clientY;
            }
        }
    }, { passive: false });
    
    document.addEventListener('touchmove', e => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.look.touchId) {
                const dx = touch.clientX - input.look.lastX;
                const dy = touch.clientY - input.look.lastY;
                
                player.rotation.y -= dx * 0.005;
                player.rotation.x -= dy * 0.005;
                player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
                
                input.look.lastX = touch.clientX;
                input.look.lastY = touch.clientY;
                
                updateCameraRotation();
                e.preventDefault();
            }
        }
    }, { passive: false });
    
    const endLook = (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === input.look.touchId) {
                input.look.touchId = null;
            }
        }
    };
    
    document.addEventListener('touchend', endLook, { passive: false });
    document.addEventListener('touchcancel', endLook, { passive: false });
    
    const setupButton = (id, action) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            action();
        }, { passive: false });
    };
    
    setupButton('btnInteract', interact);
    setupButton('btnFlashlight', toggleFlashlight);
    setupButton('btnHide', tryHide);
    
    const runBtn = document.getElementById('btnRun');
    runBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); player.isRunning = true; }, { passive: false });
    runBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); player.isRunning = false; }, { passive: false });
    runBtn.addEventListener('touchcancel', e => { player.isRunning = false; }, { passive: false });
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function updatePlayerRotation() {
    const sensitivity = 0.002;
    player.rotation.y -= input.mouse.dx * sensitivity;
    player.rotation.x -= input.mouse.dy * sensitivity;
    player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
    
    input.mouse.dx = 0;
    input.mouse.dy = 0;
    
    updateCameraRotation();
}

function updateCameraRotation() {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.rotation.y;
    camera.rotation.x = player.rotation.x;
}

// ============ التفاعل ============
function interact() {
    if (!player.canInteract || !player.interactTarget) return;
    
    const target = player.interactTarget;
    
    if (target.type === 'door') {
        interactDoor(target);
    } else if (target.type === 'item') {
        collectItem(target);
    } else if (target.type === 'note') {
        readNote(target);
    } else if (target.type === 'puzzle') {
        startPuzzle(target);
    } else if (target.type === 'hide') {
        enterHidingSpot(target);
    }
}

function interactDoor(door) {
    const realDoor = house.doors.find(d => d.id === door.id);
    if (!realDoor) return;
    
    if (realDoor.locked) {
        // كل مفتاح يفتح بابه المحدد فقط
        const keyIndex = player.inventory.findIndex(i => i.id === realDoor.key);
        if (keyIndex >= 0) {
            player.inventory.splice(keyIndex, 1);
            realDoor.locked = false;
            updateInventoryUI();
            showMessage('🔓 تم فتح الباب بالمفتاح الصحيح!', 2000);
            playSound(audio.door, 0.5);
            
            realDoor.isOpen = true;
            animateDoor(realDoor);
            
            if (realDoor.id === 'exitDoor') {
                setTimeout(() => winGame(), 2000);
            }
        } else {
            // رسالة مخصصة حسب الباب
            let msg = 'الباب مغلق. تحتاج إلى مفتاح.';
            if (realDoor.id === 'door2') msg = '🔒 الباب يحتاج المفتاح الصدئ';
            else if (realDoor.id === 'door4') msg = '🔒 الباب يحتاج المفتاح النحاسي';
            else if (realDoor.id === 'exitDoor') msg = '🔒 باب الخروج يحتاج المفتاح الذهبي';
            showMessage(msg, 2500);
            playSound(audio.door, 0.3);
        }
    } else {
        realDoor.isOpen = !realDoor.isOpen;
        animateDoor(realDoor);
        playSound(audio.door, 0.5);
    }
}

function animateDoor(door) {
    const targetRotation = door.isOpen ? Math.PI / 2 : 0;
    const startRotation = door.mesh.rotation.y - door.rotation;
    const startTime = Date.now();
    const duration = 500;
    
    function animate() {
        const elapsed = Date.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        
        door.mesh.rotation.y = door.rotation + startRotation + (targetRotation - startRotation) * eased;
        
        if (t < 1) requestAnimationFrame(animate);
    }
    animate();
}

function collectItem(item) {
    const realItem = house.items.find(i => i.id === item.id);
    if (!realItem || realItem.collected) return;
    
    if (player.inventory.length >= player.maxInventory) {
        showMessage('الحقيبة ممتلئة!', 2000);
        return;
    }
    
    if (realItem.type === 'battery') {
        player.battery = Math.min(player.maxBattery, player.battery + 50);
        updateBatteryUI();
        showMessage('🔋 تم شحن البطارية +50%', 2000);
    } else if (realItem.type === 'medkit') {
        player.health = Math.min(player.maxHealth, player.health + 40);
        updateHealthUI();
        showMessage('💊 تم استعادة الصحة +40', 2000);
    } else if (realItem.type === 'lighter') {
        showMessage('🔥 ولاعة! قد تكون مفيدة', 2000);
    } else if (realItem.type === 'tool') {
        showMessage('🔧 مفك براغي - أداة مفيدة', 2000);
    } else if (realItem.type === 'key') {
        // عرض اسم الباب الذي يفتحه
        let doorName = 'باب';
        if (realItem.door === 'door2') doorName = 'الباب الصدئ';
        else if (realItem.door === 'door4') doorName = 'الباب النحاسي';
        else if (realItem.door === 'exitDoor') doorName = 'باب الخروج';
        showMessage(`🗝️ ${realItem.name} - يفتح ${doorName}`, 2500);
    } else {
        showMessage(`التقطت: ${realItem.name}`, 2000);
    }
    
    player.inventory.push({
        id: realItem.id,
        name: realItem.name,
        icon: realItem.icon,
        type: realItem.type,
        door: realItem.door
    });
    
    realItem.collected = true;
    scene.remove(realItem.mesh);
    
    updateInventoryUI();
    playSound(audio.pickup, 0.5);
}

function readNote(note) {
    const realNote = house.notes.find(n => n.id === note.id);
    if (!realNote || realNote.read) return;
    
    realNote.read = true;
    gameState = 'note';
    
    const noteContent = document.getElementById('noteContent');
    noteContent.innerHTML = `<h3 style="color:#8b0000;margin-bottom:15px;">${realNote.title}</h3><p>${realNote.content.replace(/\n/g, '<br>')}</p><p style="margin-top:20px;font-size:0.8em;color:#666;">اضغط في أي مكان للإغلاق</p>`;
    
    document.getElementById('noteScreen').style.display = 'flex';
    
    const closeNote = () => {
        document.getElementById('noteScreen').style.display = 'none';
        gameState = 'playing';
        document.removeEventListener('click', closeNote);
        document.removeEventListener('touchstart', closeNote);
    };
    
    setTimeout(() => {
        document.addEventListener('click', closeNote);
        document.addEventListener('touchstart', closeNote);
    }, 100);
}
